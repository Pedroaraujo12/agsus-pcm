<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgSUS PCM | Gestão de Pagamentos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --glass: rgba(30, 41, 59, 0.7); }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at top left, #0f172a, #020617); color: #f8fafc; overflow-x: hidden; }
        .glass-card { background: var(--glass); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .nav-item { transition: all 0.2s; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 12px; margin-bottom: 12px; color: #94a3b8; }
        .nav-item:hover, .nav-item.active { background: rgba(59, 130, 246, 0.1); color: #3b82f6; }
        .main-content { height: 100vh; overflow-y: auto; }
        .step-node { display: flex; align-items: center; gap: 8px; font-size: 8px; font-weight: 800; text-transform: uppercase; color: #475569; }
        .step-complete { color: #10b981; }
        .step-active { color: #3b82f6; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="flex">

    <!-- BARRA LATERAL -->
    <aside class="w-20 h-screen glass-card border-r border-white/5 flex flex-col items-center py-8 z-50">
        <div class="mb-10 text-blue-500"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg></div>
        <nav class="flex flex-col flex-1">
            <div class="nav-item" onclick="location.href='index.html'" title="Dashboard"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></div>
            <div class="nav-item" onclick="location.href='editais.html'" title="Editais"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg></div>
            <div class="nav-item" onclick="location.href='fornecedores.html'" title="Fornecedores"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg></div>
            <div class="nav-item active" onclick="location.href='pagamentos.html'" title="Pagamentos"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 8c-1.657 0-3 1.343-3 3s1.343 3 3 3 3-1.343 3-3-1.343-3-3-3z"></path><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2z"></path></svg></div>
        </nav>
    </aside>

    <main class="flex-1 main-content p-8">
        <header class="mb-10 flex flex-col md:flex-row justify-between items-end gap-4">
            <div>
                <p class="text-xs font-medium text-blue-400 uppercase tracking-widest mb-1">Módulo Financeiro</p>
                <h1 class="text-3xl font-extrabold tracking-tight uppercase">Liquidação & NF-e</h1>
            </div>
            <button onclick="document.getElementById('modalNF').classList.remove('hidden')" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-2xl text-xs font-black uppercase shadow-lg">+ Registrar Nota Fiscal</button>
        </header>

        <div class="glass-card rounded-3xl overflow-hidden shadow-2xl">
            <div class="p-8 border-b border-white/5 bg-white/5">
                <h2 class="text-xs font-black uppercase text-slate-100 tracking-widest">Fila de Pagamentos do Banco</h2>
            </div>
            <div class="overflow-x-hidden">
                <table class="w-full text-left table-fixed">
                    <thead>
                        <tr class="text-[9px] font-black uppercase text-slate-500 border-b border-white/10 bg-slate-900/50">
                            <th class="w-[20%] px-8 py-5">NF / Contrato</th>
                            <th class="w-[40%] px-8 py-5">Pipeline de Aprovação</th>
                            <th class="w-[20%] px-8 py-5 text-right">Valor Líquido</th>
                            <th class="w-[20%] px-8 py-5 text-right">Ação</th>
                        </tr>
                    </thead>
                    <tbody id="pagamentoTable" class="text-[10px] divide-y divide-white/5"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Nova NF -->
    <div id="modalNF" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden z-[100] flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-lg rounded-3xl overflow-hidden shadow-2xl">
            <div class="bg-blue-600 px-8 py-6 flex justify-between items-center"><h2 class="text-lg font-black uppercase text-white">Registrar Nota Fiscal</h2><button onclick="document.getElementById('modalNF').classList.add('hidden')" class="text-white opacity-50">&times;</button></div>
            <form id="nfForm" class="p-8 space-y-6">
                <div><label class="text-[9px] font-black text-slate-500 uppercase">Contrato Vinculado</label><select id="nf_ct" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-xs text-white"></select></div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="text-[9px] font-black text-slate-500 uppercase">Número da NF</label><input type="text" id="nf_num" required class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-xs text-white"></div>
                    <div><label class="text-[9px] font-black text-slate-500 uppercase">Valor Líquido</label><input type="number" step="0.01" id="nf_valor" required class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-xs text-white"></div>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-2xl uppercase text-xs tracking-widest">Protocolar NF no Banco</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://qakrpkwmhlpynrphucfl.supabase.co";
        const SUPABASE_KEY = "sb_publishable_GO7Aqg_eNO6hqUIl3rAzyg_GRuiIkWE";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function init() {
            const { data: cts } = await sb.from('contratos').select('id, numero_contrato');
            const selCT = document.getElementById('nf_ct');
            cts.forEach(c => selCT.add(new Option(c.numero_contrato, c.id)));
            loadPagamentos();
        }

        async function loadPagamentos() {
            const { data } = await sb.from('pagamentos').select('*, contratos(numero_contrato, fornecedores(razao_social))').order('created_at', {ascending: false});
            const table = document.getElementById('pagamentoTable');
            table.innerHTML = data.map(p => {
                const status = p.status_liquidacao;
                return `
                <tr class="hover:bg-white/5 transition">
                    <td class="px-8 py-6"><div class="font-black text-slate-100">NF ${p.numero_nota_fiscal}</div><div class="text-[8px] text-blue-400 font-bold uppercase">${p.contratos.fornecedores.razao_social}</div></td>
                    <td class="px-8 py-6">
                        <div class="flex gap-3">
                            <div class="step-node ${['Entrada','Ateste','Liquidado','Pago'].includes(status)?'step-complete':''}">● Entrada</div>
                            <div class="step-node ${['Ateste','Liquidado','Pago'].includes(status)?'step-complete':status==='Ateste'?'step-active':''}">● Ateste</div>
                            <div class="step-node ${['Liquidado','Pago'].includes(status)?'step-complete':status==='Liquidado'?'step-active':''}">● Liquidado</div>
                            <div class="step-node ${status==='Pago'?'step-complete':''}">● Pago</div>
                        </div>
                    </td>
                    <td class="px-8 py-6 text-right font-black text-slate-100">R$ ${parseFloat(p.valor_liquido).toLocaleString('pt-br')}</td>
                    <td class="px-8 py-6 text-right"><button onclick="avancar('${p.id}', '${status}')" class="bg-blue-600/10 text-blue-400 px-3 py-1.5 rounded-lg text-[8px] font-black uppercase">Avançar Status</button></td>
                </tr>`;
            }).join('');
        }

        async function avancar(id, atual) {
            const fluxo = ['Entrada', 'Ateste', 'Liquidado', 'Pago'];
            const proximo = fluxo[fluxo.indexOf(atual) + 1] || atual;
            await sb.from('pagamentos').update({ status_liquidacao: proximo }).eq('id', id);
            location.reload();
        }

        document.getElementById('nfForm').addEventListener('submit', async e => {
            e.preventDefault();
            await sb.from('pagamentos').insert([{
                contrato_id: document.getElementById('nf_ct').value,
                numero_nota_fiscal: document.getElementById('nf_num').value,
                valor_liquido: document.getElementById('nf_valor').value
            }]);
            location.reload();
        });

        init();
    </script>
</body>
</html>
