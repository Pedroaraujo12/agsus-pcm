<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgSUS PCM | Propostas & Julgamento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --glass: rgba(30, 41, 59, 0.7); }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at top left, #0f172a, #020617); color: #f8fafc; margin: 0; overflow: hidden; display: flex; flex-direction: column; }
        @media (min-width: 1024px) { body { flex-direction: row; } }
        .glass-card { background: var(--glass); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); border-radius: 1.5rem; }
        .sidebar { width: 100%; height: auto; display: flex; flex-direction: row; align-items: center; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 100; justify-content: space-around; }
        @media (min-width: 1024px) { .sidebar { width: 80px; height: 100vh; flex-direction: column; border-right: 1px solid rgba(255,255,255,0.05); border-bottom: none; padding: 24px 0; justify-content: flex-start; } }
        .nav-item { position: relative; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; margin-bottom: 16px; color: #64748b; cursor: pointer; transition: 0.3s; }
        .nav-item:hover, .nav-item.active { color: #ffffff; background: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
        .nav-item::after { content: attr(data-title); position: absolute; left: 60px; background: #1e293b; color: white; padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 700; opacity: 0; pointer-events: none; transition: 0.2s; white-space: nowrap; border: 1px solid rgba(255,255,255,0.1); }
        @media (min-width: 1024px) { .nav-item:hover::after { opacity: 1; left: 70px; } }
        .main-container { flex: 1; padding: 32px; overflow-y: auto; }
        .status-badge { font-size: 10px; padding: 6px 14px; border-radius: 20px; font-weight: 800; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); }
        .action-btn { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.1); color: #f8fafc; transition: 0.2s; }
        .action-btn:hover { background: rgba(255,255,255,0.1); transform: scale(1.05); }
        .action-btn.delete:hover { color: #ef4444; border-color: rgba(239, 68, 68, 0.3); }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="flex">

    <!-- SIDEBAR -->
    <aside class="sidebar glass-card">
        <div class="hidden lg:flex mb-10 text-blue-500 scale-110"><svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg></div>
        <nav id="globalNav" class="flex flex-row lg:flex-col gap-2"></nav>
    </aside>

    <main class="main-container">
        <header class="mb-10 flex flex-col md:flex-row justify-between items-start md:items-end gap-6">
            <div>
                <p class="text-xs font-medium text-blue-400 uppercase tracking-widest mb-1">Julgamento & Seleção</p>
                <h1 class="text-3xl font-extrabold tracking-tight uppercase">Módulo de Propostas</h1>
            </div>
            <button onclick="document.getElementById('modalLance').classList.remove('hidden')" class="bg-blue-600 hover:bg-blue-500 text-white px-8 py-4 rounded-2xl text-xs font-black uppercase tracking-widest transition shadow-lg shadow-blue-500/30 flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"/></svg> Registrar Proposta
            </button>
        </header>

        <div class="glass-card rounded-[2.5rem] overflow-hidden shadow-2xl">
            <div class="p-8 border-b border-white/5 bg-white/5 flex justify-between items-center">
                <div class="flex flex-col gap-1">
                    <select id="selectProcesso" class="bg-transparent border-none text-sm font-black uppercase text-slate-100 outline-none cursor-pointer hover:text-blue-400 transition">
                        <option value="">Selecione um Processo...</option>
                    </select>
                    <span id="totalLabel" class="text-[10px] font-bold text-slate-500 tracking-widest">TOTAL DE PROPOSTAS: 0</span>
                </div>
            </div>

            <div class="p-4 overflow-x-auto">
                <table class="w-full text-left min-w-[800px] border-separate border-spacing-0">
                    <thead>
                        <tr class="text-[10px] font-bold uppercase text-slate-500 tracking-widest">
                            <th class="px-6 py-4">Fornecedor / Valor</th>
                            <th class="px-6 py-4">Envio</th>
                            <th class="px-6 py-4 text-center">Status</th>
                            <th class="px-6 py-4 text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="propostaTable" class="text-[11px] divide-y divide-white/5">
                        <!-- Conteúdo real -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- MODAL REGISTRAR LANCE -->
    <div id="modalLance" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden z-[200] flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-lg rounded-3xl overflow-hidden shadow-2xl">
            <div class="bg-blue-600 px-8 py-6 flex justify-between items-center text-white"><h2 class="text-sm font-black uppercase">Novo Registro de Lance</h2><button onclick="document.getElementById('modalLance').classList.add('hidden')" class="text-2xl opacity-50">&times;</button></div>
            <form id="lanceForm" class="p-8 space-y-6">
                <div><label class="text-[9px] font-black text-slate-500 uppercase block mb-2">Processo</label><select id="l_proc" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-xs text-white"></select></div>
                <div><label class="text-[9px] font-black text-slate-500 uppercase block mb-2">Fornecedor</label><select id="l_forn" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-xs text-white"></select></div>
                <div><label class="text-[9px] font-black text-slate-500 uppercase block mb-2">Valor (R$)</label><input type="number" id="l_val" step="0.01" required class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-xs text-white"></div>
                <button type="submit" class="w-full bg-blue-600 py-4 rounded-2xl font-black uppercase text-xs">Salvar Proposta</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://qakrpkwmhlpynrphucfl.supabase.co";
        const SUPABASE_KEY = "sb_publishable_GO7Aqg_eNO6hqUIl3rAzyg_GRuiIkWE";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const menuItems = [
            { title: 'Dashboard', icon: '<path d="M4 6h16M4 12h16M4 18h16"/>', link: 'index.html' },
            { title: 'Propostas', icon: '<path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>', link: 'propostas.html' }
        ];

        async function init() {
            document.getElementById('globalNav').innerHTML = menuItems.map(m => `<div class="nav-item ${window.location.pathname.includes(m.link)?'active':''}" data-title="${m.title}" onclick="location.href='${m.link}'"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">${m.icon}</svg></div>`).join('');
            const { data: ps } = await sb.from('licitacoes').select('id_processo');
            const { data: fs } = await sb.from('fornecedores').select('id, razao_social');
            const selP = document.getElementById('selectProcesso');
            const lProc = document.getElementById('l_proc');
            const lForn = document.getElementById('l_forn');
            ps.forEach(p => { selP.add(new Option(p.id_processo, p.id_processo)); lProc.add(new Option(p.id_processo, p.id_processo)); });
            fs.forEach(f => lForn.add(new Option(f.razao_social, f.id)));
            selP.onchange = (e) => loadData(e.target.value);
        }

        async function loadData(pid) {
            if(!pid) return;
            const { data } = await sb.from('propostas').select('*, fornecedores(razao_social)').eq('processo_id', pid).order('valor_proposta');
            document.getElementById('totalLabel').innerText = `TOTAL DE PROPOSTAS: ${data.length}`;
            document.getElementById('propostaTable').innerHTML = data.map(p => `
                <tr class="hover:bg-white/5 transition">
                    <td class="px-6 py-8">
                        <div class="font-bold text-slate-100 text-[12px] uppercase">${p.fornecedores.razao_social}</div>
                        <div class="font-black text-slate-400 text-[10px] mt-1">R$ ${parseFloat(p.valor_proposta).toLocaleString('pt-br')}</div>
                    </td>
                    <td class="px-6 py-8 text-slate-300 font-bold">${new Date(p.data_lance).toLocaleDateString('pt-br')}</td>
                    <td class="px-6 py-8 text-center"><span class="status-badge text-slate-100">${p.status_julgamento || 'Recebida'}</span></td>
                    <td class="px-6 py-8">
                        <div class="flex justify-center gap-3">
                            <button class="action-btn"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg></button>
                            <button class="action-btn"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg></button>
                            <button class="action-btn delete"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>
                        </div>
                    </td>
                </tr>`).join('');
        }

        document.getElementById('lanceForm').onsubmit = async (e) => {
            e.preventDefault();
            await sb.from('propostas').insert([{ processo_id: document.getElementById('l_proc').value, fornecedor_id: document.getElementById('l_forn').value, valor_proposta: document.getElementById('l_val').value }]);
            location.reload();
        }
        init();
    </script>
</body>
</html>
