<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgSUS PCM | Propostas & Julgamento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --glass: rgba(30, 41, 59, 0.7); }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at top left, #0f172a, #020617); color: #f8fafc; overflow-x: hidden; }
        .glass-card { background: var(--glass); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .nav-item { transition: all 0.2s; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 12px; margin-bottom: 12px; color: #94a3b8; }
        .nav-item:hover, .nav-item.active { background: rgba(59, 130, 246, 0.1); color: #3b82f6; }
        .main-content { height: 100vh; overflow-y: auto; }
        .winner-row { background: rgba(16, 185, 129, 0.05); border-left: 4px solid #10b981 !important; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="flex">

    <!-- BARRA LATERAL COMPLETA -->
    <aside class="w-20 h-screen glass-card border-r border-white/5 flex flex-col items-center py-8 z-50">
        <div class="mb-10 text-blue-500"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg></div>
        <nav class="flex flex-col flex-1">
            <div class="nav-item" onclick="location.href='index.html'" title="Dashboard"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></div>
            <div class="nav-item" onclick="location.href='editais.html'" title="Editais"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg></div>
            <div class="nav-item" onclick="location.href='fornecedores.html'" title="Fornecedores"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg></div>
            <div class="nav-item active" onclick="location.href='propostas.html'" title="Propostas"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg></div>
            <div class="nav-item" onclick="location.href='avaliacao.html'" title="Almoxarifado"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div>
            <div class="nav-item" onclick="location.href='contratos.html'" title="Contratos"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2"/></svg></div>
        </nav>
    </aside>

    <main class="flex-1 main-content p-8">
        <header class="mb-10 flex flex-col md:flex-row justify-between items-end gap-4">
            <div>
                <p class="text-xs font-medium text-blue-400 uppercase tracking-widest mb-1">Módulo de Julgamento</p>
                <h1 class="text-3xl font-extrabold tracking-tight uppercase">Análise de Propostas Real</h1>
            </div>
            <div class="flex gap-3">
                <select id="selectProcesso" class="bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-xs text-white outline-none focus:border-blue-500 transition">
                    <option value="">Selecione um Processo...</option>
                </select>
                <button onclick="document.getElementById('modalLance').classList.remove('hidden')" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-2xl text-xs font-black uppercase tracking-widest shadow-lg">+ Registrar Lance</button>
            </div>
        </header>

        <div class="glass-card rounded-3xl overflow-hidden shadow-2xl">
            <div class="p-8 border-b border-white/5 bg-white/5 flex justify-between items-center">
                <h2 class="text-sm font-black uppercase text-slate-100">Mapa de Lances do Banco</h2>
                <div id="savingReal" class="text-emerald-400 font-black text-xs uppercase tracking-tighter"></div>
            </div>
            <div class="overflow-x-hidden">
                <table class="w-full text-left table-fixed">
                    <thead>
                        <tr class="text-[9px] font-black uppercase text-slate-500 border-b border-white/10 bg-slate-900/50">
                            <th class="w-[10%] px-8 py-5">Rank</th>
                            <th class="w-[45%] px-8 py-5">Fornecedor</th>
                            <th class="w-[25%] px-8 py-5 text-right">Valor</th>
                            <th class="w-[20%] px-8 py-5 text-right">Ação</th>
                        </tr>
                    </thead>
                    <tbody id="propostaTable" class="text-[10px] divide-y divide-white/5"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Novo Lance -->
    <div id="modalLance" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden z-[100] flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-lg rounded-3xl overflow-hidden shadow-2xl">
            <div class="bg-blue-600 px-8 py-6 flex justify-between items-center"><h2 class="text-lg font-black uppercase text-white">Novo Lance</h2><button onclick="document.getElementById('modalLance').classList.add('hidden')" class="text-white opacity-50">&times;</button></div>
            <form id="lanceForm" class="p-8 space-y-6">
                <div><label class="text-[9px] font-black text-slate-500 uppercase">Processo</label><select id="lance_proc" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-xs text-white"></select></div>
                <div><label class="text-[9px] font-black text-slate-500 uppercase">Fornecedor</label><select id="lance_forn" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-xs text-white"></select></div>
                <div><label class="text-[9px] font-black text-slate-500 uppercase">Valor do Lance (R$)</label><input type="number" step="0.01" id="lance_valor" required class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-xs text-white"></div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-2xl uppercase text-xs tracking-widest">Registrar no Banco</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://qakrpkwmhlpynrphucfl.supabase.co";
        const SUPABASE_KEY = "sb_publishable_GO7Aqg_eNO6hqUIl3rAzyg_GRuiIkWE";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function init() {
            const { data: procs } = await sb.from('licitacoes').select('id_processo, objeto_resumido, vlr_estimado_anual');
            const { data: forns } = await sb.from('fornecedores').select('id, razao_social');
            
            const selP = document.getElementById('selectProcesso');
            const lanP = document.getElementById('lance_proc');
            const lanF = document.getElementById('lance_forn');

            procs.forEach(p => {
                const opt = new Option(`${p.id_processo} - ${p.objeto_resumido.substring(0,20)}`, p.id_processo);
                opt.dataset.est = p.vlr_estimado_anual;
                selP.add(opt); lanP.add(opt.cloneNode(true));
            });
            forns.forEach(f => { lanF.add(new Option(f.razao_social, f.id)); });

            selP.addEventListener('change', e => loadPropostas(e.target.value, e.target.options[e.target.selectedIndex].dataset.est));
        }

        async function loadPropostas(pid, est) {
            const { data } = await sb.from('propostas').select('*, fornecedores(razao_social)').eq('processo_id', pid).order('valor_proposta');
            const table = document.getElementById('propostaTable');
            table.innerHTML = data.map((l, idx) => `
                <tr class="${idx === 0 ? 'winner-row' : ''}">
                    <td class="px-8 py-6 font-black ${idx === 0 ? 'text-emerald-400' : 'text-slate-500'}">#0${idx+1}</td>
                    <td class="px-8 py-6"><div class="font-bold text-slate-100">${l.fornecedores.razao_social}</div></td>
                    <td class="px-8 py-6 text-right font-black text-slate-100">R$ ${parseFloat(l.valor_proposta).toLocaleString('pt-br')}</td>
                    <td class="px-8 py-6 text-right"><button class="text-[9px] font-black uppercase text-blue-400">Opções</button></td>
                </tr>`).join('');
            if(data.length > 0) document.getElementById('savingReal').innerText = `Saving: R$ ${(est - data[0].valor_proposta).toLocaleString('pt-br')}`;
        }

        document.getElementById('lanceForm').addEventListener('submit', async e => {
            e.preventDefault();
            await sb.from('propostas').insert([{
                processo_id: document.getElementById('lance_proc').value,
                fornecedor_id: document.getElementById('lance_forn').value,
                valor_proposta: document.getElementById('lance_valor').value
            }]);
            location.reload();
        });

        init();
    </script>
</body>
</html>
