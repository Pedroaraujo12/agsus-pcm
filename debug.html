<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgSUS PCM | TESTE DE CONEXÃO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-white p-10 font-sans">
    <div class="max-w-xl mx-auto bg-slate-900 p-8 rounded-2xl border border-slate-800 shadow-2xl">
        <h1 class="text-2xl font-black mb-6 text-blue-500 uppercase tracking-tighter">Status do Sistema AgSUS</h1>
        
        <div id="statusBox" class="space-y-4">
            <div class="flex items-center justify-between p-4 bg-slate-800 rounded-xl">
                <span class="text-xs font-bold text-slate-400 uppercase">Conexão Supabase</span>
                <span id="sbStatus" class="text-xs font-black text-amber-500 animate-pulse">VERIFICANDO...</span>
            </div>
            
            <div class="flex items-center justify-between p-4 bg-slate-800 rounded-xl">
                <span class="text-xs font-bold text-slate-400 uppercase">Processos Encontrados</span>
                <span id="sbCount" class="text-xs font-black text-slate-500">--</span>
            </div>
        </div>

        <button onclick="location.href='index.html'" class="w-full mt-8 bg-blue-600 hover:bg-blue-500 py-4 rounded-xl font-black uppercase text-xs tracking-widest transition">Voltar para o Dashboard</button>
        
        <div id="debugLog" class="mt-8 p-4 bg-black rounded-lg text-[10px] font-mono text-emerald-500 overflow-auto max-h-40 border border-slate-800">
            > Aguardando inicialização...
        </div>
    </div>

    <script>
        const log = (msg) => {
            const el = document.getElementById('debugLog');
            el.innerHTML += `<br>> ${msg}`;
            el.scrollTop = el.scrollHeight;
        };

        async function checkConnection() {
            const SUPABASE_URL = "https://qakrpkwmhlpynrphucfl.supabase.co";
            const SUPABASE_KEY = "sb_publishable_GO7Aqg_eNO6hqUIl3rAzyg_GRuiIkWE";
            
            try {
                log("Iniciando cliente Supabase...");
                const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                
                log("Executando consulta na tabela 'licitacoes'...");
                const { data, error } = await sb.from('licitacoes').select('id_processo', { count: 'exact' });
                
                if (error) throw error;
                
                log(`Sucesso! ${data.length} processos recuperados.`);
                document.getElementById('sbStatus').innerText = "CONECTADO";
                document.getElementById('sbStatus').className = "text-xs font-black text-emerald-500";
                document.getElementById('sbCount').innerText = data.length;
                document.getElementById('sbCount').className = "text-xs font-black text-white";
                
            } catch (err) {
                log(`ERRO: ${err.message}`);
                document.getElementById('sbStatus').innerText = "FALHA";
                document.getElementById('sbStatus').className = "text-xs font-black text-red-500";
                console.error(err);
            }
        }

        window.onload = checkConnection;
    </script>
</body>
</html>
