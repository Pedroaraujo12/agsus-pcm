<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgSUS PCM | Gestão de Fornecedores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --glass: rgba(30, 41, 59, 0.7); }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at top left, #0f172a, #020617); color: #f8fafc; margin: 0; overflow: hidden; }
        .glass-card { background: var(--glass); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .nav-item { transition: all 0.2s; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 12px; margin-bottom: 12px; color: #94a3b8; }
        .nav-item:hover, .nav-item.active { background: rgba(59, 130, 246, 0.1); color: #3b82f6; }
        .main-content { height: 100vh; overflow-y: auto; }
        .rating-star { color: #facc15; }
        .cnd-valid { color: #22c55e; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="flex">

    <!-- BARRA LATERAL -->
    <aside class="w-20 h-screen glass-card border-r border-white/5 flex flex-col items-center py-8 z-50">
        <div class="mb-10 text-blue-500"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg></div>
        <nav class="flex flex-col flex-1">
            <div class="nav-item" onclick="location.href='index.html'"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></div>
            <div class="nav-item" onclick="location.href='editais.html'"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg></div>
            <div class="nav-item active" onclick="location.href='fornecedores.html'"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg></div>
            <div class="nav-item" onclick="location.href='propostas.html'"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg></div>
            <div class="nav-item" onclick="location.href='avaliacao.html'"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div>
            <div class="nav-item" onclick="location.href='contratos.html'"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2"/></svg></div>
            <div class="nav-item" onclick="location.href='pagamentos.html'"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 8c-1.657 0-3 1.343-3 3s1.343 3 3 3 3-1.343 3-3-1.343-3-3-3z"></path><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zM12 20c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8z"></path></svg></div>
            <div class="nav-item" onclick="location.href='relatorios.html'"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10l4 4v10a2 2 0 01-2 2z"></path><path d="M14 4v4h4"></path><path d="M7 8h2"></path><path d="M7 12h10"></path><path d="M7 16h10"></path></svg></div>
        </nav>
    </aside>

    <main class="flex-1 main-content p-8">
        <header class="mb-10 flex justify-between items-end">
            <div>
                <p class="text-xs font-medium text-blue-400 uppercase tracking-widest mb-1">Módulo SRM</p>
                <h1 class="text-3xl font-extrabold tracking-tight uppercase">Base de Fornecedores</h1>
            </div>
            <div class="flex gap-4">
                <button onclick="document.getElementById('modalFornecedor').classList.remove('hidden')" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-2xl text-xs font-black uppercase tracking-widest transition shadow-lg shadow-blue-500/20">+ Novo Fornecedor</button>
            </div>
        </header>

        <!-- LISTAGEM REAL -->
        <div class="glass-card rounded-3xl overflow-hidden shadow-2xl">
            <div class="p-8 border-b border-white/5 bg-white/5 flex justify-between items-center">
                <h2 class="text-sm font-black uppercase tracking-widest text-slate-100">Fornecedores Cadastrados</h2>
                <span id="totalForn" class="text-[10px] font-bold text-slate-500 bg-white/5 px-3 py-1 rounded-full">-- cadastrados</span>
            </div>
            <div class="overflow-x-hidden">
                <table class="w-full text-left table-fixed">
                    <thead>
                        <tr class="text-[9px] font-black uppercase text-slate-500 border-b border-white/10 bg-slate-900/50">
                            <th class="w-[30%] px-8 py-5">Razão Social / CNPJ</th>
                            <th class="w-[20%] px-8 py-5">Categoria</th>
                            <th class="w-[15%] px-8 py-5 text-center">CND</th>
                            <th class="w-[15%] px-8 py-5 text-center">Rating</th>
                            <th class="w-[20%] px-8 py-5 text-right">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="fornecedorTable" class="text-[10px] divide-y divide-white/5">
                        <!-- Conectado ao Supabase -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Novo Fornecedor -->
    <div id="modalFornecedor" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden z-[100] flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-lg rounded-3xl overflow-hidden shadow-2xl">
            <div class="bg-blue-600 px-8 py-6 flex justify-between items-center">
                <h2 class="text-lg font-black uppercase text-white">Cadastrar Empresa</h2>
                <button onclick="document.getElementById('modalFornecedor').classList.add('hidden')" class="text-white opacity-50 hover:opacity-100">&times;</button>
            </div>
            <form id="fornForm" class="p-8 space-y-6">
                <div><label class="text-[9px] font-black text-slate-500 uppercase">Razão Social</label><input type="text" id="razao_social" required class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-xs text-white outline-none"></div>
                <div><label class="text-[9px] font-black text-slate-500 uppercase">CNPJ</label><input type="text" id="cnpj" required placeholder="00.000.000/0001-00" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-xs text-white outline-none"></div>
                <div><label class="text-[9px] font-black text-slate-500 uppercase">Categoria</label><select id="categoria" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-xs text-white outline-none"><option>Saúde</option><option>TI</option><option>Mobiliário</option><option>Serviços</option></select></div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-2xl uppercase text-xs tracking-widest transition">Salvar Fornecedor</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://qakrpkwmhlpynrphucfl.supabase.co";
        const SUPABASE_KEY = "sb_publishable_GO7Aqg_eNO6hqUIl3rAzyg_GRuiIkWE";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadFornecedores() {
            const { data, error } = await sb.from('fornecedores').select('*').order('razao_social');
            if (error) return;
            document.getElementById('totalForn').innerText = data.length + " cadastrados";
            const table = document.getElementById('fornecedorTable');
            table.innerHTML = data.map(f => `
                <tr class="hover:bg-white/5 transition">
                    <td class="px-8 py-6"><div class="font-black text-slate-100">${f.razao_social}</div><div class="text-[8px] text-slate-500 uppercase">${f.cnpj}</div></td>
                    <td class="px-8 py-6 text-slate-400 font-bold">${f.categoria || 'Geral'}</td>
                    <td class="px-8 py-6 text-center"><span class="cnd-valid">● OK</span></td>
                    <td class="px-8 py-6 text-center text-amber-400 font-black">${f.rating || '5.0'}</td>
                    <td class="px-8 py-6 text-right"><button class="text-blue-400 font-black uppercase text-[9px] hover:underline">Ver Dossiê</button></td>
                </tr>`).join('');
        }

        document.getElementById('fornForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                razao_social: document.getElementById('razao_social').value,
                cnpj: document.getElementById('cnpj').value,
                categoria: document.getElementById('categoria').value
            };
            const { error } = await sb.from('fornecedores').insert([payload]);
            if (!error) {
                document.getElementById('modalFornecedor').classList.add('hidden');
                document.getElementById('fornForm').reset();
                loadFornecedores();
            }
        });

        loadFornecedores();
    </script>
</body>
</html>
