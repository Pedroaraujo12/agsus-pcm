<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgSUS PCM | Novo Processo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --glass: rgba(15, 23, 42, 0.9); --accent: #3b82f6; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at top left, #0f172a, #020617); color: #f8fafc; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .glass-card { background: var(--glass); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 1.5rem; }
        .input-base { background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; padding: 10px 14px; color: white; font-size: 13px; outline: none; width: 100%; transition: all 0.2s; }
        .input-base:focus { border-color: var(--accent); }
        label { font-size: 10px; font-weight: 800; text-transform: uppercase; color: #64748b; letter-spacing: 0.1em; margin-bottom: 6px; display: block; }
        .btn-primary { background: var(--accent); color: white; padding: 14px; border-radius: 10px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; transition: 0.2s; width: 100%; }
        .btn-primary:hover { background: #2563eb; transform: translateY(-1px); }
        option { background: #0f172a; color: white; }
    </style>
</head>
<body class="p-4">

    <div class="glass-card w-full max-w-2xl shadow-2xl overflow-hidden">
        <div class="bg-blue-600 p-8 flex justify-between items-center text-white">
            <div>
                <h1 class="text-2xl font-black uppercase tracking-tight">Protocolar Processo</h1>
                <p class="text-[10px] font-bold text-blue-100 uppercase tracking-widest mt-1">Módulo de Entrada AgSUS</p>
            </div>
            <button onclick="location.href='index.html'" class="text-white/50 hover:text-white transition text-2xl">&times;</button>
        </div>

        <form id="procForm" class="p-8 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label>ID do Processo (SEI)</label>
                    <input type="text" id="id_processo" required placeholder="AGSUS.00XXXX/2026-XX" class="input-base">
                </div>
                <div>
                    <label>Objeto Resumido</label>
                    <input type="text" id="objeto_resumido" required class="input-base">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label>Responsável</label>
                    <select id="responsavel" class="input-base" required><option value="">Carregando...</option></select>
                </div>
                <div>
                    <label>Etapa Atual (SLA)</label>
                    <select id="fase_atual" class="input-base" required><option value="">Carregando...</option></select>
                </div>
            </div>

            <!-- NOVO CAMPO: LINK DO PROCESSO SEI -->
            <div>
                <label>Link de Acesso (SEI / Documento Externo)</label>
                <input type="url" id="processo_link" placeholder="https://sei.agsus.gov.br/..." class="input-base">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label>Data de Recebimento</label>
                    <input type="date" id="data_recebimento" required class="input-base">
                </div>
                <div>
                    <label>Data de Entrada</label>
                    <input type="date" id="data_entrada" required class="input-base">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label>Demandante</label>
                    <select id="demandante" class="input-base">
                        <option>NAAGE</option><option>DIRETORIA</option><option>SAUDE</option><option>INFRA</option>
                    </select>
                </div>
                <div>
                    <label>Modalidade</label>
                    <select id="modalidade" class="input-base">
                        <option>Pregão Eletrônico</option><option>Cotação de Preços</option><option>Dispensa</option><option>Inexigibilidade</option>
                    </select>
                </div>
                <div>
                    <label>Valor Estimado</label>
                    <input type="number" id="vlr_estimado" step="0.01" class="input-base">
                </div>
            </div>

            <button type="submit" class="btn-primary mt-4">Confirmar Protocolo</button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = "https://qakrpkwmhlpynrphucfl.supabase.co";
        const SUPABASE_KEY = "sb_publishable_GO7Aqg_eNO6hqUIl3rAzyg_GRuiIkWE";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('data_recebimento').valueAsDate = new Date();
        document.getElementById('data_entrada').valueAsDate = new Date();

        async function init() {
            const { data: equipe } = await sb.from('equipe').select('nome').order('nome');
            const { data: etapas } = await sb.from('fluxo_etapas').select('descricao').order('ordem');

            const selR = document.getElementById('responsavel');
            selR.innerHTML = '<option value="">Selecione...</option>';
            equipe.forEach(r => selR.add(new Option(r.nome, r.nome)));

            const selF = document.getElementById('fase_atual');
            selF.innerHTML = '<option value="">Selecione...</option>';
            etapas.forEach(e => selF.add(new Option(e.descricao, e.descricao)));
        }

        document.getElementById('procForm').onsubmit = async (e) => {
            e.preventDefault();
            const payload = {
                id_processo: document.getElementById('id_processo').value,
                objeto_resumido: document.getElementById('objeto_resumido').value,
                responsavel: document.getElementById('responsavel').value,
                fase_atual: document.getElementById('fase_atual').value,
                processo_link: document.getElementById('processo_link').value,
                data_recebimento: document.getElementById('data_recebimento').value,
                data_entrada: document.getElementById('data_entrada').value,
                demandante: document.getElementById('demandante').value,
                modalidade: document.getElementById('modalidade').value,
                vlr_estimado_anual: document.getElementById('vlr_estimado').value,
                status: 'Em análise'
            };
            const { error } = await sb.from('licitacoes').insert([payload]);
            if(!error) location.href = 'index.html';
            else alert("Erro ao cadastrar: " + error.message);
        }
        init();
    </script>
</body>
</html>
