<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgSUS PCM | Novo Processo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --glass: rgba(30, 41, 59, 0.7); }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at top left, #0f172a, #020617); color: #f8fafc; margin: 0; min-height: 100vh; }
        .glass-card { background: var(--glass); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .form-input { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px; color: white; outline: none; width: 100%; transition: all 0.2s; }
        .form-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
        label { font-size: 10px; font-weight: 800; text-transform: uppercase; color: #94a3b8; letter-spacing: 0.05em; margin-bottom: 6px; display: block; }
    </style>
</head>
<body class="p-4 md:p-8 flex justify-center items-center">

    <div class="glass-card w-full max-w-2xl rounded-3xl overflow-hidden shadow-2xl">
        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 px-8 py-6 flex justify-between items-center">
            <div>
                <h2 class="text-xl font-black uppercase tracking-tight text-white">Novo Processo Licitatório</h2>
                <p class="text-[10px] font-bold text-blue-100 uppercase tracking-widest">Workflow das 17 Etapas • Lei 14.133/21</p>
            </div>
            <a href="index.html" class="text-white opacity-50 hover:opacity-100 transition"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></a>
        </div>

        <form class="p-8 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label>ID do Processo (SEI)</label>
                    <input type="text" placeholder="AGSUS.XXXXXX/2026-XX" class="form-input">
                </div>
                <div>
                    <label>Objeto Resumido</label>
                    <input type="text" placeholder="Ex: Aquisição de Mobiliário" class="form-input">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label>Demandante</label>
                    <select class="form-input">
                        <option>NAAGE</option>
                        <option>Diretoria</option>
                        <option>Saúde</option>
                        <option>Infraestrutura</option>
                    </select>
                </div>
                <div>
                    <label>Modalidade</label>
                    <select class="form-input">
                        <option>Pregão Eletrônico</option>
                        <option>Cotação de Preços</option>
                        <option>Dispensa</option>
                        <option>Inexigibilidade</option>
                    </select>
                </div>
                <div>
                    <label>Prioridade</label>
                    <select class="form-input">
                        <option>Normal</option>
                        <option>Alta</option>
                        <option>Urgente</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label>Valor Estimado (R$)</label>
                    <input type="number" step="0.01" placeholder="0,00" class="form-input">
                </div>
                <div>
                    <label>Data de Entrada</label>
                    <input type="date" class="form-input">
                </div>
            </div>

            <div>
                <label>Observações Estratégicas</label>
                <textarea rows="3" placeholder="Notas sobre o planejamento inicial..." class="form-input"></textarea>
            </div>

            <div class="pt-4 flex gap-4">
                <button type="button" class="flex-1 bg-slate-800 hover:bg-slate-700 text-white font-bold py-4 rounded-2xl transition uppercase text-xs tracking-widest">Salvar Rascunho</button>
                <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-2xl shadow-lg shadow-blue-600/20 transition uppercase text-xs tracking-widest">Protocolar Processo</button>
            </div>
        </form>
    </div>

</body>
</html>
