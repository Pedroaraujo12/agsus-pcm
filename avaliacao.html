<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgSUS PCM | Almoxarifado Virtual</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --glass: rgba(30, 41, 59, 0.7); }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at top left, #0f172a, #020617); color: #f8fafc; overflow-x: hidden; }
        .glass-card { background: var(--glass); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .nav-item { transition: all 0.2s; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 12px; margin-bottom: 12px; color: #94a3b8; }
        .nav-item:hover, .nav-item.active { background: rgba(59, 130, 246, 0.1); color: #3b82f6; }
        .main-content { height: 100vh; overflow-y: auto; }
        .progress-container { height: 6px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; }
        .progress-bar { height: 100%; transition: width 0.5s ease-out; }
        .aging-badge { font-size: 8px; padding: 2px 6px; border-radius: 4px; font-weight: 900; text-transform: uppercase; white-space: nowrap; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="flex">

    <!-- BARRA LATERAL -->
    <aside class="w-20 h-screen glass-card border-r border-white/5 flex flex-col items-center py-8 z-50">
        <div class="mb-10 text-blue-500"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg></div>
        <nav class="flex flex-col flex-1">
            <div class="nav-item" onclick="location.href='index.html'" title="Dashboard"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></div>
            <div class="nav-item" onclick="location.href='editais.html'" title="Editais"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg></div>
            <div class="nav-item" onclick="location.href='fornecedores.html'" title="Fornecedores"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg></div>
            <div class="nav-item active" onclick="location.href='avaliacao.html'" title="Almoxarifado"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div>
        </nav>
    </aside>

    <main class="flex-1 main-content p-8">
        <header class="mb-10 flex flex-col md:flex-row justify-between items-end gap-4">
            <div>
                <p class="text-xs font-medium text-blue-400 uppercase tracking-widest mb-1">Módulo de Avaliação & Consumo</p>
                <h1 class="text-3xl font-extrabold tracking-tight uppercase">Almoxarifado Virtual Real</h1>
            </div>
            <div class="flex gap-3">
                <button onclick="document.getElementById('modalItem').classList.remove('hidden')" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-2xl text-xs font-black uppercase tracking-widest shadow-lg">+ Registrar Item de Ata</button>
            </div>
        </header>

        <!-- GRID DE SALDO DINÂMICO -->
        <div id="saldoGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-12">
            <!-- Gerado via Supabase -->
        </div>

        <!-- FILA DE REQUISIÇÕES REAL -->
        <div class="glass-card rounded-3xl overflow-hidden shadow-2xl">
            <div class="p-8 border-b border-white/5 bg-white/5">
                <h2 class="text-sm font-black uppercase tracking-widest text-slate-100">Fila de Aprovação (Banco de Dados)</h2>
            </div>
            <div class="overflow-x-hidden">
                <table class="w-full text-left table-fixed">
                    <thead>
                        <tr class="text-[9px] font-black uppercase text-slate-500 border-b border-white/10 bg-slate-900/50">
                            <th class="w-[20%] px-8 py-5">Demandante</th>
                            <th class="w-[30%] px-8 py-5">Item / Destino</th>
                            <th class="w-[15%] px-8 py-5 text-center">Quantidade</th>
                            <th class="w-[35%] px-8 py-5 text-right">Ação</th>
                        </tr>
                    </thead>
                    <tbody id="requisicaoTable" class="text-[10px] divide-y divide-white/5"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Novo Item de Ata -->
    <div id="modalItem" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden z-[100] flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-lg rounded-3xl overflow-hidden shadow-2xl">
            <div class="bg-blue-600 px-8 py-6 flex justify-between items-center"><h2 class="text-lg font-black uppercase text-white">Registrar Saldo de Ata</h2><button onclick="document.getElementById('modalItem').classList.add('hidden')" class="text-white opacity-50">&times;</button></div>
            <form id="itemForm" class="p-8 space-y-6">
                <div><label class="text-[9px] font-black text-slate-500 uppercase">Processo Vinculado</label><select id="item_proc" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-xs text-white"></select></div>
                <div><label class="text-[9px] font-black text-slate-500 uppercase">Descrição do Item</label><input type="text" id="item_desc" required class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-xs text-white"></div>
                <div><label class="text-[9px] font-black text-slate-500 uppercase">Quantidade Total Registrada</label><input type="number" id="item_qtd" required class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-xs text-white"></div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-2xl uppercase text-xs tracking-widest">Abrir Saldo</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://qakrpkwmhlpynrphucfl.supabase.co";
        const SUPABASE_KEY = "sb_publishable_GO7Aqg_eNO6hqUIl3rAzyg_GRuiIkWE";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function init() {
            const { data: procs } = await sb.from('licitacoes').select('id_processo');
            const selP = document.getElementById('item_proc');
            procs.forEach(p => { selP.add(new Option(p.id_processo, p.id_processo)); });

            loadSaldos();
            loadRequisicoes();
        }

        async function loadSaldos() {
            const { data } = await sb.from('itens_ata').select('*');
            const grid = document.getElementById('saldoGrid');
            grid.innerHTML = data.map(i => {
                const perc = (i.qtd_consumida / i.qtd_total) * 100;
                return `
                <div class="glass-card p-6 rounded-3xl">
                    <div class="flex justify-between mb-4">
                        <h3 class="text-sm font-black text-white">${i.descricao_item}</h3>
                        <span class="text-[10px] font-bold text-blue-400">${i.qtd_total} ${i.unidade_medida}</span>
                    </div>
                    <div class="progress-container mb-2"><div class="progress-bar bg-blue-500" style="width: ${perc}%"></div></div>
                    <div class="flex justify-between text-[8px] font-bold uppercase text-slate-500">
                        <span>Consumido: ${i.qtd_consumida}</span>
                        <span>Saldo: ${i.qtd_total - i.qtd_consumida}</span>
                    </div>
                </div>`;
            }).join('');
        }

        async function loadRequisicoes() {
            const { data } = await sb.from('requisicoes').select('*, itens_ata(descricao_item)').eq('status_aprovacao', 'Pendente');
            const table = document.getElementById('requisicaoTable');
            table.innerHTML = data.map(r => `
                <tr>
                    <td class="px-8 py-5"><span class="font-black text-blue-400">${r.area_demandante}</span></td>
                    <td class="px-8 py-5"><div class="font-bold text-slate-100">${r.itens_ata.descricao_item}</div><div class="text-[8px] text-slate-500">${r.municipio_destino}</div></td>
                    <td class="px-8 py-5 text-center font-black">${r.qtd_solicitada}</td>
                    <td class="px-8 py-5 text-right space-x-2">
                        <button onclick="decidir('${r.id}', 'Rejeitado')" class="bg-red-500/10 text-red-400 px-3 py-1 rounded-lg text-[8px] font-black uppercase">Negar</button>
                        <button onclick="decidir('${r.id}', 'Aprovado')" class="bg-emerald-500 text-white px-3 py-1 rounded-lg text-[8px] font-black uppercase">Aprovar OF</button>
                    </td>
                </tr>`).join('');
        }

        async function decidir(id, status) {
            await sb.from('requisicoes').update({ status_aprovacao: status }).eq('id', id);
            location.reload();
        }

        document.getElementById('itemForm').addEventListener('submit', async e => {
            e.preventDefault();
            await sb.from('itens_ata').insert([{
                processo_id: document.getElementById('item_proc').value,
                descricao_item: document.getElementById('item_desc').value,
                qtd_total: document.getElementById('item_qtd').value,
                valor_unitario: 0 // Simplificado para o protótipo
            }]);
            location.reload();
        });

        init();
    </script>
</body>
</html>
