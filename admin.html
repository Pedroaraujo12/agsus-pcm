<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgSUS PCM | Governança Estratégica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --glass: rgba(15, 23, 42, 0.8); --accent: #3b82f6; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; color: #f8fafc; margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
        @media (min-width: 1024px) { body { flex-direction: row; } }
        
        .glass-card { background: var(--glass); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08); border-radius: 1rem; }
        
        /* SIDEBAR PROFISSIONAL */
        .sidebar { width: 100%; height: auto; display: flex; flex-direction: row; align-items: center; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 100; justify-content: space-around; flex-shrink: 0; background: #0f172a; }
        @media (min-width: 1024px) { .sidebar { width: 72px; height: 100vh; flex-direction: column; border-right: 1px solid rgba(255,255,255,0.05); border-bottom: none; padding: 24px 0; justify-content: flex-start; position: sticky; top: 0; } }
        
        .nav-item { position: relative; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; margin-bottom: 12px; color: #64748b; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .nav-item:hover, .nav-item.active { color: #ffffff; background: var(--accent); box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }
        
        .nav-item .tooltip {
            visibility: hidden; position: absolute; background: #1e293b; color: white; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; white-space: nowrap; border: 1px solid rgba(255,255,255,0.1); z-index: 1000; opacity: 0; transition: all 0.2s ease; pointer-events: none;
        }
        @media (min-width: 1024px) { .nav-item .tooltip { left: 140%; top: 50%; transform: translateY(-50%); } .nav-item:hover .tooltip { visibility: visible; opacity: 1; } }

        .main-content { flex: 1; padding: 32px; overflow-y: auto; }
        .input-base { background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; padding: 10px 14px; color: white; font-size: 13px; outline: none; width: 100%; transition: border 0.2s; }
        .input-base:focus { border-color: var(--accent); }
        
        .list-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; transition: 0.2s; }
        .list-card:hover { border-color: var(--accent); background: rgba(255,255,255,0.06); }
        .btn-primary { background: var(--accent); color: white; padding: 10px 20px; border-radius: 8px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; transition: 0.2s; }
        .btn-primary:hover { background: #2563eb; transform: translateY(-1px); }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="hidden lg:flex mb-10 text-blue-500 scale-125">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        </div>
        <nav id="globalNav" class="flex flex-row lg:flex-col"></nav>
    </aside>

    <main class="main-content">
        <header class="mb-10">
            <h1 class="text-3xl font-black uppercase tracking-tight">Governança AgSUS</h1>
            <p class="text-slate-400 text-xs font-medium uppercase tracking-[0.2em] mt-1">Configuração de Normativos e Equipe</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
            <!-- EQUIPE -->
            <section>
                <div class="flex justify-between items-end mb-6">
                    <h2 class="text-sm font-black text-blue-400 uppercase tracking-widest">Equipe de Compras</h2>
                    <button onclick="openModal('equipe')" class="btn-primary">+ Novo</button>
                </div>
                <div id="listEquipe" class="space-y-2"></div>
            </section>

            <!-- ETAPAS -->
            <section>
                <div class="flex justify-between items-end mb-6">
                    <h2 class="text-sm font-black text-indigo-400 uppercase tracking-widest">Fluxo & SLA (Dias Úteis)</h2>
                    <button onclick="openModal('fluxo')" class="btn-primary">+ Nova Etapa</button>
                </div>
                <div id="listFluxo" class="space-y-2"></div>
            </section>
        </div>
    </main>

    <!-- MODAL ADMIN -->
    <div id="modalAdmin" class="fixed inset-0 bg-slate-950/90 backdrop-blur-sm hidden z-[200] flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-md shadow-2xl border border-white/10 overflow-hidden">
            <div class="bg-blue-600 p-6 flex justify-between items-center text-white">
                <h3 id="modalTitle" class="text-sm font-black uppercase tracking-widest">Configuração</h3>
                <button onclick="closeModal()" class="text-2xl font-light">&times;</button>
            </div>
            <form id="adminForm" class="p-8 space-y-6">
                <input type="hidden" id="formType">
                <input type="hidden" id="editId">
                <div>
                    <label class="text-[9px] font-black text-slate-500 uppercase block mb-2">Descrição / Nome</label>
                    <input type="text" id="inputNome" required class="input-base">
                </div>
                <div id="extraFields" class="hidden">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-[9px] font-black text-slate-500 uppercase block mb-2">Fase Macro</label>
                            <select id="inputFase" class="input-base">
                                <option>Planejamento</option><option>Produção</option><option>Revisão</option>
                                <option>Análise</option><option>Execução</option><option>Aprovação</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[9px] font-black text-slate-500 uppercase block mb-2">SLA (Dias Úteis)</label>
                            <input type="number" id="inputPrazo" class="input-base">
                        </div>
                    </div>
                </div>
                <button type="submit" class="w-full btn-primary py-4">Salvar Alterações</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://qakrpkwmhlpynrphucfl.supabase.co";
        const SUPABASE_KEY = "sb_publishable_GO7Aqg_eNO6hqUIl3rAzyg_GRuiIkWE";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const menuItems = [
            { title: 'Dashboard', icon: '<path d="M4 6h16M4 12h16M4 18h16"/>', link: 'index.html' },
            { title: 'Protocolar', icon: '<path d="M12 4v16m8-8H4"/>', link: 'novo-processo.html' },
            { title: 'Governança', icon: '<path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>', link: 'admin.html' }
        ];

        async function init() {
            const nav = document.getElementById('globalNav');
            nav.innerHTML = menuItems.map(m => `
                <div class="nav-item ${window.location.pathname.includes(m.link)?'active':''}" onclick="location.href='${m.link}'">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">${m.icon}</svg>
                    <span class="tooltip">${m.title}</span>
                </div>`).join('');
            loadEquipe();
            loadFluxo();
        }

        async function loadEquipe() {
            const { data } = await sb.from('equipe').select('*').order('nome');
            document.getElementById('listEquipe').innerHTML = data.map(r => `
                <div class="list-card">
                    <span class="font-bold text-sm text-slate-100">${r.nome}</span>
                    <div class="flex gap-4">
                        <button onclick="editEquipe('${r.id}', '${r.nome}')" class="text-[9px] font-black text-blue-400 uppercase hover:underline">Editar</button>
                        <button onclick="deleteItem('equipe', '${r.id}')" class="text-[9px] font-black text-red-500 uppercase hover:underline">Excluir</button>
                    </div>
                </div>`).join('');
        }

        async function loadFluxo() {
            const { data } = await sb.from('fluxo_etapas').select('*').order('ordem');
            document.getElementById('listFluxo').innerHTML = data.map(e => `
                <div class="list-card">
                    <div>
                        <p class="text-[9px] font-black text-indigo-400 uppercase tracking-widest">${e.fase}</p>
                        <p class="font-bold text-sm text-white">${e.descricao}</p>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="bg-indigo-500/20 text-indigo-400 px-3 py-1 rounded text-[10px] font-black">${e.prazo_dias_uteis}D</span>
                        <button onclick="editFluxo(${JSON.stringify(e).replace(/'/g, "&apos;")})" class="text-[9px] font-black text-blue-400 uppercase">Editar</button>
                    </div>
                </div>`).join('');
        }

        function openModal(type) {
            document.getElementById('formType').value = type;
            document.getElementById('editId').value = '';
            document.getElementById('modalTitle').innerText = type === 'equipe' ? 'Novo Responsável' : 'Nova Etapa SLA';
            document.getElementById('extraFields').classList.toggle('hidden', type !== 'fluxo');
            document.getElementById('modalAdmin').classList.remove('hidden');
        }

        function editEquipe(id, nome) {
            openModal('equipe');
            document.getElementById('editId').value = id;
            document.getElementById('inputNome').value = nome;
        }

        function editFluxo(item) {
            openModal('fluxo');
            document.getElementById('editId').value = item.id;
            document.getElementById('inputNome').value = item.descricao;
            document.getElementById('inputFase').value = item.fase;
            document.getElementById('inputPrazo').value = item.prazo_dias_uteis;
        }

        function closeModal() { document.getElementById('modalAdmin').classList.add('hidden'); document.getElementById('adminForm').reset(); }

        document.getElementById('adminForm').onsubmit = async (e) => {
            e.preventDefault();
            const type = document.getElementById('formType').value;
            const id = document.getElementById('editId').value;
            const nome = document.getElementById('inputNome').value;

            if(type === 'equipe') {
                if(id) await sb.from('equipe').update({ nome }).eq('id', id);
                else await sb.from('equipe').insert([{ nome }]);
            } else {
                const fase = document.getElementById('inputFase').value;
                const prazo = document.getElementById('inputPrazo').value;
                if(id) await sb.from('fluxo_etapas').update({ fase, descricao: nome, prazo_dias_uteis: prazo }).eq('id', id);
                else await sb.from('fluxo_etapas').insert([{ fase, descricao: nome, prazo_dias_uteis: prazo, ordem: 99 }]);
            }
            closeModal();
            location.reload();
        }

        async function deleteItem(table, id) {
            if(confirm('Excluir permanentemente?')) {
                await sb.from(table).delete().eq('id', id);
                location.reload();
            }
        }
        window.onload = init;
    </script>
</body>
</html>
