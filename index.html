<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgSUS PCM | Gestão Estratégica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { border: '#e2e8f0', background: '#0f172a' } } } }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #f8fafc; }
        .bg-card { background: #1e293b; }
        .border-border { border: 1px solid #334155; }
    </style>
</head>
<body class="flex h-screen bg-slate-950">

    <!-- Sidebar -->
    <aside class="w-64 border-r border-border bg-slate-900 hidden md:flex flex-col p-6">
        <h2 class="text-xl font-bold mb-10 text-white tracking-tighter">AgSUS PCM</h2>
        <nav class="space-y-4">
            <a href="#" class="block text-blue-400 font-medium">Dashboard</a>
            <a href="#" class="block text-slate-400 hover:text-white transition">Licitações</a>
            <a href="#" class="block text-slate-400 hover:text-white transition">Processos</a>
            <a href="#" class="block text-slate-400 hover:text-white transition">Configurações</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-8">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl font-bold">Gestão Estratégica</h1>
                <p class="text-slate-400 text-sm">Monitoramento de Licitações</p>
            </div>
            <button class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm font-medium">+ Novo Processo</button>
        </header>

        <!-- Stats -->
        <div class="grid grid-cols-4 gap-4 mb-8">
            <div class="bg-card p-6 rounded-lg border border-border">
                <p class="text-xs text-slate-400 font-medium">Ativos</p>
                <h3 id="totalProcessos" class="text-3xl font-bold">-</h3>
            </div>
            <div class="bg-card p-6 rounded-lg border border-border">
                <p class="text-xs text-slate-400 font-medium">Valor Total</p>
                <h3 id="vlrEstimado" class="text-xl font-bold">R$ 0,00</h3>
            </div>
        </div>

        <!-- Filters -->
        <div class="bg-card p-4 rounded-lg border border-border mb-6 flex gap-4">
            <input type="text" id="search" placeholder="Filtrar por ID..." class="bg-slate-900 px-3 py-2 rounded text-sm w-full outline-none border border-slate-700">
            <select id="statusFilter" class="bg-slate-900 px-3 py-2 rounded text-sm border border-slate-700">
                <option value="Todos">Status</option>
            </select>
        </div>

        <!-- Table -->
        <div class="bg-card rounded-lg border border-border overflow-hidden">
            <table class="w-full text-sm text-left">
                <thead class="bg-slate-800 text-slate-300 uppercase text-[10px] tracking-wider">
                    <tr>
                        <th class="p-4">Processo</th>
                        <th class="p-4">Objeto</th>
                        <th class="p-4">Status</th>
                        <th class="p-4 text-right">Valor</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="divide-y divide-border"></tbody>
            </table>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
