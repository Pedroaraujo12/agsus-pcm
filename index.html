<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgSUS PCM | Navegação Central</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --glass: rgba(30, 41, 59, 0.7); }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at top left, #0f172a, #020617); color: #f8fafc; margin: 0; overflow: hidden; }
        .glass-card { background: var(--glass); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        
        /* Sidebar Estilizada conforme imagem do usuário */
        .sidebar { width: 80px; height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 0; border-right: 1px solid rgba(255,255,255,0.05); z-index: 100; }
        .nav-item { position: relative; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; margin-bottom: 16px; color: #64748b; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .nav-item:hover { color: #3b82f6; background: rgba(59, 130, 246, 0.1); }
        .nav-item.active { color: #ffffff; background: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
        
        /* Tooltip de Navegação */
        .nav-item::after { content: attr(data-title); position: absolute; left: 60px; background: #1e293b; color: white; padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 700; opacity: 0; pointer-events: none; transition: 0.2s; white-space: nowrap; border: 1px solid rgba(255,255,255,0.1); }
        .nav-item:hover::after { opacity: 1; left: 70px; }

        .main-container { flex: 1; height: 100vh; overflow-y: auto; padding: 32px; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="flex">

    <!-- SIDEBAR DE ALTA NAVEGABILIDADE -->
    <aside class="sidebar glass-card">
        <div class="mb-10 text-blue-500 scale-110">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        </div>
        
        <nav id="globalNav">
            <!-- Os itens serão injetados pelo JS para garantir sincronia em todas as páginas -->
        </nav>

        <div class="mt-auto opacity-50 hover:opacity-100 transition cursor-pointer" onclick="location.href='index.html'">
            <div class="w-10 h-10 rounded-full bg-slate-800 border border-white/10 flex items-center justify-center text-[10px] font-bold">PA</div>
        </div>
    </aside>

    <!-- ÁREA DE CONTEÚDO (EXEMPLO DASHBOARD) -->
    <main class="main-container">
        <div id="pageContent">
            <!-- Conteúdo dinâmico aqui -->
             <header class="mb-10 flex justify-between items-end">
                <div>
                    <p class="text-xs font-medium text-blue-400 uppercase tracking-widest mb-1">Navegação Fluida</p>
                    <h1 class="text-3xl font-extrabold tracking-tight uppercase">Portal AgSUS PCM</h1>
                </div>
                <div class="flex gap-4">
                    <div class="glass-card px-4 py-2 rounded-xl text-[10px] font-bold border border-emerald-500/20 text-emerald-400 flex items-center gap-2">
                        <span class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span> Interoperabilidade SEI: OK
                    </div>
                </div>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- Atalhos Rápidos -->
                <div class="glass-card p-8 rounded-3xl border-l-4 border-l-blue-500 cursor-pointer hover:bg-white/5 transition" onclick="location.href='novo-processo.html'">
                    <h3 class="text-lg font-black mb-2 uppercase">Novo Processo</h3>
                    <p class="text-xs text-slate-400 leading-relaxed">Inicie um novo rito processual vinculado ao ID SEI.</p>
                </div>
                <div class="glass-card p-8 rounded-3xl border-l-4 border-l-emerald-500 cursor-pointer hover:bg-white/5 transition" onclick="location.href='avaliacao.html'">
                    <h3 class="text-lg font-black mb-2 uppercase">Almoxarifado</h3>
                    <p class="text-xs text-slate-400 leading-relaxed">Gerencie saldos de Atas e aprove requisições de áreas.</p>
                </div>
                <div class="glass-card p-8 rounded-3xl border-l-4 border-l-amber-500 cursor-pointer hover:bg-white/5 transition" onclick="location.href='relatorios.html'">
                    <h3 class="text-lg font-black mb-2 uppercase">Relatórios</h3>
                    <p class="text-xs text-slate-400 leading-relaxed">Gere documentos oficiais e prestações de contas.</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        // MAPA MESTRE DE NAVEGAÇÃO (Centralizado para interoperabilidade)
        const menuItems = [
            { id: 'dash', title: 'Dashboard', icon: '<path d="M4 6h16M4 12h16M4 18h16"/>', link: 'index.html' },
            { id: 'proc', title: 'Novo Processo', icon: '<path d="M12 4v16m8-8H4"/>', link: 'novo-processo.html' },
            { id: 'edit', title: 'Editais', icon: '<path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>', link: 'editais.html' },
            { id: 'forn', title: 'Fornecedores', icon: '<path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>', link: 'fornecedores.html' },
            { id: 'prop', title: 'Propostas', icon: '<path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>', link: 'propostas.html' },
            { id: 'eval', title: 'Avaliação', icon: '<path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>', link: 'avaliacao.html' },
            { id: 'cont', title: 'Contratos', icon: '<path d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2"/>', link: 'contratos.html' },
            { id: 'pay',  title: 'Pagamentos', icon: '<path d="M12 8c-1.657 0-3 1.343-3 3s1.343 3 3 3 3-1.343 3-3-1.343-3-3-3z"></path><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2z"></path>', link: 'pagamentos.html' },
            { id: 'rep',  title: 'Relatórios', icon: '<path d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10l4 4v10a2 2 0 01-2 2z"></path><path d="M14 4v4h4"></path>', link: 'relatorios.html' }
        ];

        function buildNav() {
            const nav = document.getElementById('globalNav');
            const currentPath = window.location.pathname.split('/').pop() || 'index.html';
            
            nav.innerHTML = menuItems.map(item => {
                const isActive = item.link === currentPath;
                return `
                    <div class="nav-item ${isActive ? 'active' : ''}" 
                         data-title="${item.title}" 
                         onclick="location.href='${item.link}'">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            ${item.icon}
                        </svg>
                    </div>
                `;
            }).join('');
        }

        buildNav();
    </script>
</body>
</html>
