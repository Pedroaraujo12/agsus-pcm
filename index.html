<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgSUS PCM | Gestão de Compras</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --glass: rgba(30, 41, 59, 0.7); }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at top left, #0f172a, #020617); color: #f8fafc; margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
        @media (min-width: 768px) { body { flex-direction: row; overflow: hidden; } }
        .glass-card { background: var(--glass); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .sidebar { width: 80px; height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 0; border-right: 1px solid rgba(255,255,255,0.05); z-index: 100; justify-content: flex-start; }
        .nav-item { position: relative; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; margin-bottom: 16px; color: #64748b; transition: all 0.3s; cursor: pointer; }
        .nav-item:hover, .nav-item.active { color: #ffffff; background: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
        .nav-item::after { content: attr(data-title); position: absolute; left: 60px; background: #1e293b; color: white; padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 700; opacity: 0; pointer-events: none; transition: 0.2s; white-space: nowrap; border: 1px solid rgba(255,255,255,0.1); }
        .nav-item:hover::after { opacity: 1; left: 70px; }
        .main-container { flex: 1; padding: 32px; overflow-y: auto; height: 100vh; }
        .aging-badge { font-size: 8px; padding: 4px 8px; border-radius: 20px; font-weight: 900; text-transform: uppercase; white-space: nowrap; }
        .aging-red { background-color: #ef4444; color: white; }
        .aging-yellow { background-color: #f59e0b; color: black; }
        .aging-green { background-color: #22c55e; color: white; }
        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 0 8px; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="flex">

    <aside class="sidebar glass-card">
        <div class="mb-10 text-blue-500 scale-110"><svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg></div>
        <nav id="globalNav" class="flex flex-col gap-2"></nav>
    </aside>

    <main class="main-container">
        <header class="mb-10 flex justify-between items-end">
            <div>
                <p class="text-[10px] font-medium text-blue-400 uppercase tracking-widest mb-1">AgSUS PCM SaaS</p>
                <h1 class="text-3xl font-extrabold tracking-tight uppercase">Fluxo de Execução</h1>
            </div>
            <div class="flex gap-4">
                <button onclick="location.href='novo-processo.html'" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-2xl text-[10px] font-black uppercase tracking-widest transition shadow-lg shadow-blue-500/20">+ Novo Registro</button>
            </div>
        </header>

        <div class="glass-card rounded-[2rem] overflow-hidden p-8 shadow-2xl">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-xl font-black uppercase tracking-tight text-slate-100">Fluxo de Execução</h2>
                <span id="rowCount" class="text-xs font-bold text-slate-500 tracking-widest">-- PROCESSOS</span>
            </div>

            <div class="table-container">
                <table class="text-left">
                    <thead>
                        <tr class="text-[10px] font-black uppercase text-slate-500 tracking-widest border-b border-white/5">
                            <th class="w-[18%] pb-4 px-2">ID Processo</th>
                            <th class="w-[32%] pb-4 px-2">Fase / Status</th>
                            <th class="w-[18%] pb-4 px-2 text-center">Prazo Tarefa</th>
                            <th class="w-[15%] pb-4 px-2 text-center">Entrega Final</th>
                            <th class="w-[17%] pb-4 px-2 text-right">Vlr Estimado</th>
                        </tr>
                    </thead>
                    <tbody id="mainTable" class="text-[11px]">
                        <!-- Carregado via Supabase -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = "https://qakrpkwmhlpynrphucfl.supabase.co";
        const SUPABASE_KEY = "sb_publishable_GO7Aqg_eNO6hqUIl3rAzyg_GRuiIkWE";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const menuItems = [
            { title: 'Dashboard', icon: '<path d="M4 6h16M4 12h16M4 18h16"/>', link: 'index.html' },
            { title: 'Editais', icon: '<path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>', link: 'editais.html' },
            { title: 'Fornecedores', icon: '<path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>', link: 'fornecedores.html' },
            { title: 'Almoxarifado', icon: '<path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>', link: 'avaliacao.html' },
            { title: 'Contratos', icon: '<path d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2"/>', link: 'contratos.html' },
            { title: 'Pagamentos', icon: '<path d="M12 8c-1.657 0-3 1.343-3 3s1.343 3 3 3 3-1.343 3-3-1.343-3-3-3z"></path><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2z"></path>', link: 'pagamentos.html' },
            { title: 'Relatórios', icon: '<path d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10l4 4v10a2 2 0 01-2 2z"></path><path d="M14 4v4h4"></path>', link: 'relatorios.html' }
        ];

        function renderNav() {
            const path = window.location.pathname.split('/').pop() || 'index.html';
            document.getElementById('globalNav').innerHTML = menuItems.map(m => `
                <div class="nav-item ${m.link === path ? 'active' : ''}" data-title="${m.title}" onclick="location.href='${m.link}'">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">${m.icon}</svg>
                </div>
            `).join('');
        }

        function getAging(dateStr) {
            if (!dateStr || dateStr === 'None') return { label: 'N/A', class: '', iso: null };
            const target = new Date(dateStr);
            const today = new Date(); today.setHours(0,0,0,0);
            const diff = Math.ceil((target - today) / (86400000));
            if (diff < 0) return { label: `Atrasado ${Math.abs(diff)}d`, class: 'aging-red', iso: dateStr };
            if (diff <= 1) return { label: `Vence em ${diff}d`, class: 'aging-yellow', iso: dateStr };
            return { label: `No Prazo (${diff}d)`, class: 'aging-green', iso: dateStr };
        }

        async function loadData() {
            renderNav();
            const { data, error } = await sb.from('licitacoes').select('*').order('id_processo');
            if (error) return;
            document.getElementById('rowCount').innerText = data.length + " PROCESSOS";
            
            document.getElementById('mainTable').innerHTML = data.map(i => {
                const metaMatch = i.observacoes ? i.observacoes.match(/<!--METADATA_DATES:ATIV=(.*)\|FINAL=(.*)-->/) : null;
                const agingAtiv = getAging(i.data_prevista);
                const dataFinal = metaMatch ? metaMatch[2] : null;

                return `
                <tr class="hover:bg-white/5 transition-all group">
                    <td class="py-5 px-2 font-black text-blue-400 truncate">${i.id_processo}</td>
                    <td class="py-5 px-2">
                        <div class="font-bold text-slate-100 truncate text-[12px]">${i.fase_atual || '-'}</div>
                        <div class="text-[9px] text-slate-500 uppercase truncate font-bold opacity-60">${i.objeto_resumido}</div>
                    </td>
                    <td class="py-5 px-2 text-center">
                        <span class="aging-badge ${agingAtiv.class}">${agingAtiv.label}</span>
                        <div class="text-[9px] text-slate-500 mt-1 font-bold">${agingAtiv.iso ? new Date(agingAtiv.iso).toLocaleDateString('pt-br') : '-'}</div>
                    </td>
                    <td class="py-5 px-2 text-center text-slate-100 font-bold">${dataFinal ? new Date(dataFinal).toLocaleDateString('pt-br') : '-'}</td>
                    <td class="py-5 px-2 text-right font-black text-slate-100">R$ ${parseFloat(i.vlr_estimado_anual||0).toLocaleString('pt-br')}</td>
                </tr>
            `}).join('');
        }
        loadData();
    </script>
</body>
</html>
