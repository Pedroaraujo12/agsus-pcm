<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgSUS PCM | Gestão de Compras</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --glass: rgba(30, 41, 59, 0.7); }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at top left, #0f172a, #020617); color: #f8fafc; margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
        @media (min-width: 768px) { body { flex-direction: row; overflow: hidden; } }
        .glass-card { background: var(--glass); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .sidebar { width: 100%; height: auto; display: flex; flex-direction: row; align-items: center; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 100; justify-content: space-around; }
        @media (min-width: 768px) { .sidebar { width: 80px; height: 100vh; flex-direction: column; border-right: 1px solid rgba(255,255,255,0.05); border-bottom: none; padding: 24px 0; justify-content: flex-start; } }
        .nav-item { position: relative; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 10px; color: #64748b; transition: all 0.3s; cursor: pointer; }
        @media (min-width: 768px) { .nav-item { margin-bottom: 16px; width: 44px; height: 44px; } }
        .nav-item:hover { color: #3b82f6; background: rgba(59, 130, 246, 0.1); }
        .nav-item.active { color: #ffffff; background: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
        .main-container { flex: 1; padding: 16px; overflow-y: auto; }
        @media (min-width: 768px) { .main-container { padding: 32px; height: 100vh; } }
        .filter-select { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 8px 12px; color: #e2e8f0; font-size: 11px; outline: none; transition: all 0.2s; width: 100%; cursor: pointer; }
        .filter-select:focus { border-color: #3b82f6; }
        .aging-badge { font-size: 8px; padding: 2px 6px; border-radius: 4px; font-weight: 900; text-transform: uppercase; white-space: nowrap; }
        .aging-red { background-color: #ef4444; color: white; }
        .aging-green { background-color: #22c55e; color: white; }
        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { min-width: 800px; width: 100%; table-layout: fixed; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="flex">

    <aside class="sidebar glass-card">
        <div class="hidden md:flex mb-10 text-blue-500 scale-110"><svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg></div>
        <nav id="globalNav" class="flex flex-row md:flex-col gap-2"></nav>
    </aside>

    <main class="main-container">
        <header class="mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4">
            <div>
                <p class="text-[10px] font-medium text-blue-400 uppercase tracking-widest mb-1">AgSUS PCM SaaS</p>
                <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight uppercase">Dashboard Operacional</h1>
            </div>
            <button onclick="location.href='novo-processo.html'" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-2xl text-[10px] font-black uppercase tracking-widest transition shadow-lg shadow-blue-500/20">+ Novo Processo</button>
        </header>

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-6 mb-8">
            <div class="glass-card p-4 rounded-2xl"><p class="text-[8px] font-bold text-slate-500 uppercase mb-1">Processos</p><h3 id="stat_procs" class="text-2xl font-extrabold">--</h3></div>
            <div class="glass-card p-4 rounded-2xl"><p class="text-[8px] font-bold text-slate-500 uppercase mb-1">Total Estimado</p><h3 id="stat_val" class="text-lg font-extrabold truncate">R$ 0,00</h3></div>
            <div class="glass-card p-4 rounded-2xl"><p class="text-[8px] font-bold text-emerald-500 uppercase mb-1">Savings</p><h3 id="stat_save" class="text-lg font-extrabold text-emerald-400 truncate">R$ 0,00</h3></div>
            <div class="glass-card p-4 rounded-2xl border-l-4 border-l-red-500"><p class="text-[8px] font-bold text-red-500 uppercase mb-1">Atrasos</p><h3 id="stat_delay" class="text-2xl font-extrabold text-red-100">--</h3></div>
        </div>

        <!-- FILTROS COMPLETOS -->
        <div class="glass-card p-4 rounded-2xl mb-8 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
            <input type="text" id="searchBox" onkeyup="filterData()" placeholder="Buscar objeto ou ID..." class="filter-select bg-slate-800/40">
            <select id="f-responsavel" onchange="filterData()" class="filter-select"><option value="Todos">Responsável: Todos</option></select>
            <select id="f-modalidade" onchange="filterData()" class="filter-select"><option value="Todos">Modalidade: Todas</option></select>
            <select id="f-status" onchange="filterData()" class="filter-select"><option value="Todos">Status: Todos</option></select>
            <select id="f-demandante" onchange="filterData()" class="filter-select"><option value="Todos">Demandante: Todos</option></select>
        </div>

        <div class="glass-card rounded-2xl overflow-hidden shadow-2xl">
            <div class="table-container">
                <table class="text-left border-collapse">
                    <thead class="bg-slate-900/50">
                        <tr class="text-[9px] font-black uppercase text-slate-500 border-b border-white/10 tracking-tighter">
                            <th class="w-[15%] px-6 py-4">ID SEI</th>
                            <th class="w-[30%] px-6 py-4">Objeto</th>
                            <th class="w-[15%] px-6 py-4">Responsável</th>
                            <th class="w-[10%] px-6 py-4 text-center">Status</th>
                            <th class="w-[15%] px-6 py-4 text-right">Vlr Est.</th>
                            <th class="w-[15%] px-6 py-4 text-right">Vlr Homol.</th>
                        </tr>
                    </thead>
                    <tbody id="mainTable" class="text-[10px] divide-y divide-white/5"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = "https://qakrpkwmhlpynrphucfl.supabase.co";
        const SUPABASE_KEY = "sb_publishable_GO7Aqg_eNO6hqUIl3rAzyg_GRuiIkWE";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let rawData = [];

        const menuItems = [
            { title: 'Home', icon: '<path d="M4 6h16M4 12h16M4 18h16"/>', link: 'index.html' },
            { title: 'Novo', icon: '<path d="M12 4v16m8-8H4"/>', link: 'novo-processo.html' },
            { title: 'Forn.', icon: '<path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>', link: 'fornecedores.html' },
            { title: 'Pagam.', icon: '<path d="M12 8c-1.657 0-3 1.343-3 3s1.343 3 3 3 3-1.343 3-3-1.343-3-3-3z"></path><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2z"></path>', link: 'pagamentos.html' },
            { title: 'Relat.', icon: '<path d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10l4 4v10a2 2 0 01-2 2z"></path><path d="M14 4v4h4"></path>', link: 'relatorios.html' }
        ];

        function renderNav() {
            const path = window.location.pathname.split('/').pop() || 'index.html';
            document.getElementById('globalNav').innerHTML = menuItems.map(m => `
                <div class="nav-item ${m.link === path ? 'active' : ''}" data-title="${m.title}" onclick="location.href='${m.link}'">
                    <svg class="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">${m.icon}</svg>
                </div>
            `).join('');
        }

        async function init() {
            renderNav();
            const { data, error } = await sb.from('licitacoes').select('*').order('id_processo');
            if (error) return;
            rawData = data || [];
            populateFilters();
            renderTable(rawData);
            updateStats(rawData);
        }

        function populateFilters() {
            const getUnique = (key) => [...new Set(rawData.map(i => i[key]).filter(Boolean))].sort();
            const fill = (id, items) => {
                const el = document.getElementById(id);
                items.forEach(v => el.add(new Option(v, v)));
            };
            fill('f-responsavel', getUnique('responsavel'));
            fill('f-modalidade', getUnique('modalidade'));
            fill('f-status', getUnique('status'));
            fill('f-demandante', getUnique('demandante'));
        }

        function filterData() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            const resp = document.getElementById('f-responsavel').value;
            const mod = document.getElementById('f-modalidade').value;
            const stat = document.getElementById('f-status').value;
            const dem = document.getElementById('f-demandante').value;

            const filtered = rawData.filter(i => {
                const matchSearch = !query || (i.id_processo + i.objeto_resumido).toLowerCase().includes(query);
                const matchResp = resp === 'Todos' || i.responsavel === resp;
                const matchMod = mod === 'Todos' || i.modalidade === mod;
                const matchStat = stat === 'Todos' || i.status === stat;
                const matchDem = dem === 'Todos' || i.demandante === dem;
                return matchSearch && matchResp && matchMod && matchStat && matchDem;
            });
            renderTable(filtered);
            updateStats(filtered);
        }

        function updateStats(data) {
            document.getElementById('stat_procs').innerText = data.length;
            const est = data.reduce((acc, i) => acc + (parseFloat(i.vlr_estimado_anual)||0), 0);
            const hom = data.reduce((acc, i) => acc + (parseFloat(i.vlr_homologado)||0), 0);
            document.getElementById('stat_val').innerText = est.toLocaleString('pt-br', {style:'currency', currency:'BRL', maximumFractionDigits: 0});
            document.getElementById('stat_save').innerText = (hom > 0 ? est - hom : 0).toLocaleString('pt-br', {style:'currency', currency:'BRL', maximumFractionDigits: 0});
            document.getElementById('stat_delay').innerText = data.filter(i => String(i.status).includes('Atraso')).length;
        }

        function renderTable(data) {
            document.getElementById('mainTable').innerHTML = data.map(i => `
                <tr class="hover:bg-white/5 transition">
                    <td class="px-6 py-4 font-black text-blue-400 truncate">${i.id_processo}</td>
                    <td class="px-6 py-4 font-bold text-slate-100 truncate" title="${i.objeto_resumido}">${i.objeto_resumido}</td>
                    <td class="px-6 py-4 text-slate-400 font-medium">${i.responsavel || '-'}</td>
                    <td class="px-6 py-4 text-center"><span class="aging-badge ${String(i.status).includes('Atraso')?'aging-red':'aging-green'}">${i.status}</span></td>
                    <td class="px-6 py-4 text-right font-black text-slate-100">R$ ${parseFloat(i.vlr_estimado_anual||0).toLocaleString('pt-br', {minimumFractionDigits: 0})}</td>
                    <td class="px-6 py-4 text-right font-black text-emerald-400">R$ ${parseFloat(i.vlr_homologado||0).toLocaleString('pt-br', {minimumFractionDigits: 0})}</td>
                </tr>
            `).join('');
        }
        init();
    </script>
</body>
</html>
