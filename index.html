<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgSUS PCM | Gestão de Compras</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --glass: rgba(30, 41, 59, 0.7); }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at top left, #0f172a, #020617); color: #f8fafc; margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
        @media (min-width: 1024px) { body { flex-direction: row; overflow: hidden; } }
        .glass-card { background: var(--glass); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .sidebar { width: 100%; height: auto; display: flex; flex-direction: row; align-items: center; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 100; justify-content: space-around; overflow-x: auto; }
        @media (min-width: 1024px) { .sidebar { width: 80px; height: 100vh; flex-direction: column; border-right: 1px solid rgba(255,255,255,0.05); border-bottom: none; padding: 24px 0; justify-content: flex-start; overflow-x: hidden; } }
        .nav-item { position: relative; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 10px; color: #64748b; transition: all 0.3s; cursor: pointer; flex-shrink: 0; }
        @media (min-width: 1024px) { .nav-item { margin-bottom: 16px; width: 44px; height: 44px; } }
        .nav-item:hover, .nav-item.active { color: #ffffff; background: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
        .nav-item::after { content: attr(data-title); position: absolute; left: 60px; background: #1e293b; color: white; padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 700; opacity: 0; pointer-events: none; transition: 0.2s; white-space: nowrap; border: 1px solid rgba(255,255,255,0.1); z-index: 200; }
        @media (min-width: 1024px) { .nav-item:hover::after { opacity: 1; left: 70px; } }
        .main-container { flex: 1; padding: 16px; overflow-y: auto; width: 100%; }
        @media (min-width: 1024px) { .main-container { padding: 32px; height: 100vh; } }
        .filter-select { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 8px 12px; color: #e2e8f0; font-size: 11px; outline: none; transition: all 0.2s; width: 100%; cursor: pointer; }
        .aging-badge { font-size: 8px; padding: 4px 10px; border-radius: 4px; font-weight: 900; text-transform: uppercase; white-space: nowrap; }
        .aging-red { background-color: #ef4444; color: white; }
        .aging-yellow { background-color: #f59e0b; color: black; }
        .aging-green { background-color: #22c55e; color: white; }
        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; width: 100%; }
        table { width: 100%; min-width: 900px; table-layout: fixed; border-collapse: separate; border-spacing: 0 8px; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="flex">

    <!-- SIDEBAR COMPLETA (9 ÍCONES) -->
    <aside class="sidebar glass-card">
        <div class="hidden lg:flex mb-10 text-blue-500 scale-110">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        </div>
        <nav id="globalNav" class="flex flex-row lg:flex-col gap-2">
            <!-- Injetado via JS para garantir todos os 9 ícones -->
        </nav>
        <div class="hidden lg:flex mt-auto opacity-50"><div class="w-10 h-10 rounded-full bg-slate-800 border border-white/10 flex items-center justify-center text-[10px] font-bold">PA</div></div>
    </aside>

    <main class="main-container">
        <header class="mb-10 flex flex-col md:flex-row justify-between items-start md:items-end gap-6">
            <div class="w-full">
                <p class="text-[10px] font-medium text-blue-400 uppercase tracking-widest mb-1">AgSUS PCM SaaS</p>
                <h1 class="text-3xl md:text-5xl font-black uppercase tracking-tight leading-none">Fluxo de <br class="md:hidden"> Execução</h1>
            </div>
            <button onclick="location.href='novo-processo.html'" class="w-full md:w-auto bg-blue-600 hover:bg-blue-500 text-white px-8 py-4 rounded-2xl text-xs font-black uppercase tracking-widest transition shadow-lg shadow-blue-500/30">+ Novo Registro</button>
        </header>

        <!-- INDICADORES -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="glass-card p-6 rounded-[1.5rem]"><p class="text-[10px] font-bold text-slate-500 uppercase mb-1">Processos</p><h3 id="stat_procs" class="text-2xl font-black">--</h3></div>
            <div class="glass-card p-6 rounded-[1.5rem]"><p class="text-[10px] font-bold text-slate-500 uppercase mb-1">Estimado</p><h3 id="stat_val" class="text-lg font-black truncate">R$ 0,00</h3></div>
            <div class="glass-card p-6 rounded-[1.5rem] text-emerald-400"><p class="text-[10px] font-bold text-emerald-500/50 uppercase mb-1">Savings</p><h3 id="stat_save" class="text-lg font-black truncate">R$ 0,00</h3></div>
            <div class="glass-card p-6 rounded-[1.5rem] border-l-4 border-l-red-500 text-red-100"><p class="text-[10px] font-bold text-red-500 uppercase mb-1">Atrasos</p><h3 id="stat_delay" class="text-2xl font-black">--</h3></div>
        </div>

        <!-- FILTROS -->
        <div class="glass-card p-4 rounded-2xl mb-8 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
            <input type="text" id="searchBox" onkeyup="filterData()" placeholder="Buscar objeto ou ID..." class="filter-select bg-slate-800/40">
            <select id="f-responsavel" onchange="filterData()" class="filter-select"><option value="Todos">Responsável</option></select>
            <select id="f-modalidade" onchange="filterData()" class="filter-select"><option value="Todos">Modalidade</option></select>
            <select id="f-status" onchange="filterData()" class="filter-select"><option value="Todos">Status</option></select>
            <select id="f-demandante" onchange="filterData()" class="filter-select"><option value="Todos">Demandante</option></select>
        </div>

        <!-- TABELA -->
        <div class="glass-card rounded-[2.5rem] overflow-hidden shadow-2xl">
            <div class="table-container p-6">
                <table>
                    <thead>
                        <tr class="text-[10px] font-black uppercase text-slate-500 tracking-widest border-b border-white/5">
                            <th class="w-[15%] pb-4">ID Processo</th>
                            <th class="w-[30%] pb-4">Fase / Status</th>
                            <th class="w-[15%] pb-4">Responsável</th>
                            <th class="w-[15%] pb-4 text-center">Prazo Tarefa</th>
                            <th class="w-[15%] pb-4 text-center">Entrega Final</th>
                            <th class="w-[15%] pb-4 text-right">Vlr Est.</th>
                        </tr>
                    </thead>
                    <tbody id="mainTable" class="text-[11px] divide-y divide-white/5"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- MODAL DE FICHA DETALHADA -->
    <div id="modalDetails" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden z-[150] flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-lg rounded-[2rem] overflow-hidden shadow-2xl border border-white/10">
            <div class="p-8 space-y-6">
                <div class="glass-card p-6 rounded-2xl border border-white/5 bg-white/5"><p class="text-[8px] font-black text-blue-400 uppercase mb-2 tracking-widest">Objeto</p><h3 id="det_objeto" class="text-sm font-bold text-white leading-snug">--</h3></div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="glass-card p-6 rounded-2xl border border-white/5 bg-white/5"><p class="text-[8px] font-black text-slate-500 uppercase mb-2 tracking-widest">ID</p><h3 id="det_id" class="text-[11px] font-black text-white break-all">--</h3></div>
                    <div class="glass-card p-6 rounded-2xl border border-white/5 bg-white/5"><p class="text-[8px] font-black text-slate-500 uppercase mb-2 tracking-widest">Status</p><h3 id="det_status" class="text-sm font-black text-amber-500">--</h3></div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="glass-card p-6 rounded-2xl border border-white/5 bg-white/5"><p class="text-[8px] font-black text-slate-500 uppercase mb-2 tracking-widest">Estimado</p><h3 id="det_estimado" class="text-sm font-black text-white">R$ 0,00</h3></div>
                    <div class="glass-card p-6 rounded-2xl border border-white/5 bg-white/5"><p class="text-[8px] font-black text-slate-500 uppercase mb-2 tracking-widest">Homologado</p><h3 id="det_homologado" class="text-sm font-black text-emerald-400">R$ 0,00</h3></div>
                </div>
                <div class="pt-4 text-right"><button onclick="closeDetails()" class="bg-slate-800 hover:bg-slate-700 text-white px-8 py-2.5 rounded-xl text-[10px] font-black uppercase transition border border-white/10">Fechar</button></div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://qakrpkwmhlpynrphucfl.supabase.co";
        const SUPABASE_KEY = "sb_publishable_GO7Aqg_eNO6hqUIl3rAzyg_GRuiIkWE";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let rawData = [];

        const menuItems = [
            { title: 'Dashboard', icon: '<path d="M4 6h16M4 12h16M4 18h16"/>', link: 'index.html' },
            { title: 'Novo Processo', icon: '<path d="M12 4v16m8-8H4"/>', link: 'novo-processo.html' },
            { title: 'Editais', icon: '<path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>', link: 'editais.html' },
            { title: 'Fornecedores', icon: '<path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>', link: 'fornecedores.html' },
            { title: 'Propostas', icon: '<path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>', link: 'propostas.html' },
            { title: 'Avaliação', icon: '<path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>', link: 'avaliacao.html' },
            { title: 'Contratos', icon: '<path d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2"/>', link: 'contratos.html' },
            { title: 'Pagamentos', icon: '<path d="M12 8c-1.657 0-3 1.343-3 3s1.343 3 3 3 3-1.343 3-3-1.343-3-3-3z"></path><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2z"></path>', link: 'pagamentos.html' },
            { title: 'Relatórios', icon: '<path d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10l4 4v10a2 2 0 01-2 2z"></path><path d="M14 4v4h4"></path>', link: 'relatorios.html' }
        ];

        function getAging(dateStr) {
            if (!dateStr || dateStr === 'None') return { label: 'N/A', class: 'opacity-20' };
            const target = new Date(dateStr); const today = new Date(); today.setHours(0,0,0,0);
            const diff = Math.ceil((target - today) / 86400000);
            if (diff < 0) return { label: `Atrasado ${Math.abs(diff)}d`, class: 'aging-red' };
            if (diff <= 1) return { label: `Vence hoje`, class: 'aging-yellow' };
            return { label: `No Prazo (${diff}d)`, class: 'aging-green' };
        }

        function filterData() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            const resp = document.getElementById('f-responsavel').value;
            const mod = document.getElementById('f-modalidade').value;
            const stat = document.getElementById('f-status').value;
            const dem = document.getElementById('f-demandante').value;
            const filtered = rawData.filter(i => {
                const matchSearch = !query || (i.id_processo + i.objeto_resumido).toLowerCase().includes(query);
                const matchResp = resp === 'Todos' || i.responsavel === resp;
                const matchMod = mod === 'Todos' || i.modalidade === mod;
                const matchStat = stat === 'Todos' || i.status === stat;
                const matchDem = dem === 'Todos' || i.demandante === dem;
                return matchSearch && matchResp && matchMod && matchStat && matchDem;
            });
            renderTable(filtered);
        }

        function renderTable(data) {
            document.getElementById('mainTable').innerHTML = data.map(i => {
                const aging = getAging(i.data_prevista);
                const match = i.observacoes ? i.observacoes.match(/<!--METADATA_DATES:ATIV=(.*)\|FINAL=(.*)-->/) : null;
                return `
                <tr class="hover:bg-white/5 transition cursor-pointer" onclick="openDetails(${JSON.stringify(i).replace(/'/g, "&apos;")})">
                    <td class="py-6 font-black text-blue-400 truncate">${i.id_processo}</td>
                    <td class="py-6">
                        <div class="font-bold text-slate-100 text-[12px] leading-tight">${i.fase_atual || 'Abertura'}</div>
                        <div class="text-[9px] text-slate-500 uppercase font-black truncate">${i.objeto_resumido || ''}</div>
                    </td>
                    <td class="py-6 text-slate-400 font-bold">${i.responsavel || '-'}</td>
                    <td class="py-6 text-center">
                        <span class="aging-badge ${aging.class}">${aging.label}</span>
                        <div class="text-[9px] text-slate-500 mt-1 font-bold">${i.data_prevista ? new Date(i.data_prevista).toLocaleDateString('pt-br') : '--/--/--'}</div>
                    </td>
                    <td class="py-6 text-center text-slate-300 font-bold">${match && match[2] ? new Date(match[2]).toLocaleDateString('pt-br') : '-'}</td>
                    <td class="py-6 text-right font-black text-slate-100">R$ ${parseFloat(i.vlr_estimado_anual||0).toLocaleString('pt-br')}</td>
                </tr>`;
            }).join('');
        }

        function openDetails(item) {
            document.getElementById('det_objeto').innerText = item.objeto_resumido;
            document.getElementById('det_id').innerText = item.id_processo;
            document.getElementById('det_status').innerText = item.status;
            document.getElementById('det_estimado').innerText = 'R$ ' + parseFloat(item.vlr_estimado_anual||0).toLocaleString('pt-br');
            document.getElementById('det_homologado').innerText = 'R$ ' + parseFloat(item.vlr_homologado||0).toLocaleString('pt-br');
            document.getElementById('modalDetails').classList.remove('hidden');
        }

        function closeDetails() { document.getElementById('modalDetails').classList.add('hidden'); }

        async function init() {
            document.getElementById('globalNav').innerHTML = menuItems.map(m => `<div class="nav-item" data-title="${m.title}" onclick="location.href='${m.link}'"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">${m.icon}</svg></div>`).join('');
            const { data, error } = await sb.from('licitacoes').select('*').order('id_processo');
            if (error) return;
            rawData = data || [];
            
            const getUnique = (key) => [...new Set(rawData.map(i => i[key]).filter(v => v && String(v).trim() !== ""))].sort();
            const fill = (id, items) => { const el = document.getElementById(id); items.forEach(v => el.add(new Option(v, v))); };
            fill('f-responsavel', getUnique('responsavel')); fill('f-modalidade', getUnique('modalidade')); fill('f-status', getUnique('status')); fill('f-demandante', getUnique('demandante'));

            document.getElementById('stat_procs').innerText = data.length;
            renderTable(data);
        }
        init();
    </script>
</body>
</html>
