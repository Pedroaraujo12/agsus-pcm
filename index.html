<!DOCTYPE html>
<html lang="pt-br">
<head>

            --bg-deep: #000000;
            --glass: rgba(18, 18, 18, 0.7); 
            --accent: #3b82f6; 
            --glow: rgba(59, 130, 246, 0.3);
        }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: radial-gradient(circle at 0% 0%, #0f172a 0%, #000000 50%),
                        radial-gradient(circle at 100% 100%, #1e1b4b 0%, #000000 50%);
            color: #f8fafc; 
            margin: 0; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow-x: hidden; 
            overflow-y: auto; 
        }
        @media (min-width: 1024px) { body { flex-direction: row; } }
        
        .glass-card { 
            background: var(--glass); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.08); 
            border-radius: 1.5rem; 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }
        
        .sidebar { 
            width: 100%; 
            height: auto; 
            display: flex; 
            flex-direction: row; 
            align-items: center; 
            padding: 12px; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
            z-index: 100; 
            justify-content: space-around; 
            flex-shrink: 0; 
            background: rgba(0, 0, 0, 0.9); 
        }
        @media (min-width: 1024px) { 
            .sidebar { 
                width: 80px; 
                height: 100vh; 
                flex-direction: column; 
                border-right: 1px solid rgba(255,255,255,0.05); 
                border-bottom: none; 
                padding: 24px 0; 
                justify-content: flex-start; 
                position: sticky; 
                top: 0; 
            } 
        }
        
        .nav-item { 
            position: relative; 
            width: 48px; 
            height: 48px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 14px; 
            margin-bottom: 12px; 
            color: #64748b; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            cursor: pointer; 
        }
        .nav-item:hover, .nav-item.active { 
            color: #ffffff; 
            background: var(--accent); 
            box-shadow: 0 0 20px var(--glow); 
            transform: scale(1.05); 
        }
        @media (min-width: 1024px) {
            .nav-item .tooltip { 
                visibility: hidden; 
                position: absolute; 
                background: #111; 
                color: white; 
                padding: 6px 12px; 
                border-radius: 8px; 
                font-size: 11px; 
                font-weight: 800; 
                text-transform: uppercase; 
                white-space: nowrap; 
                border: 1px solid rgba(255,255,255,0.1); 
                z-index: 1000; 
                opacity: 0; 
                transition: 0.2s; 
                pointer-events: none; 
                left: 140%; 
                top: 50%; 
                transform: translateY(-50%); 
            }
            .nav-item:hover .tooltip { visibility: visible; opacity: 1; }
        }
        
        .status-badge { 
            font-size: 11px; 
            padding: 4px 12px; 
            border-radius: 20px; 
            font-weight: 800; 
            text-transform: uppercase; 
            background: rgba(255,255,255,0.03); 
            border: 1px solid rgba(255,255,255,0.08); 
        }
        .aging-badge { 
            font-size: 10px; 
            padding: 4px 10px; 
            border-radius: 6px; 
            font-weight: 900;

            white-space: nowrap; 
        }
        .form-input { 
            background: rgba(0, 0, 0, 0.4); 
            border: 1px solid rgba(255,255,255,0.05); 
            border-radius: 12px; 
            padding: 12px; 
            color: white; 
            outline: none; 
            width: 100%; 
            font-size: 13px; 
            transition: 0.2s; 
        }
        .form-input:focus {
            border-color: var(--accent);
            background: rgba(0, 0, 0, 0.6);
        }
        .table-wrapper { width: 100%; overflow-x: auto; border-radius: 1rem; }
        table { width: 100%; min-width: 800px; border-collapse: separate; border-spacing: 0 8px; }
        .row-hover:hover { 
            background: rgba(255,255,255,0.02); 
            box-shadow: inset 0 0 20px rgba(255,255,255,0.01);
        }
        
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #222; border-radius: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
    </style>

    <script>
        const SUPABASE_URL = "https://qakrpkwmhlpynrphucfl.supabase.co";

        let rawData = [], charts = {}, globalEtapas = [], globalEquipe = [];

            { title: 'Almoxarifado', icon: '<path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-14v4m0 0l8 4m-8-4l-8 4m8 4l8-4m-8 4V11"/>', link: 'fornecedores.html' },
            { title: 'Inventário', icon: '<path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>', link: 'avaliacao.html' },
            { title: 'Pagamentos', icon: '<path d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>', link: 'pagamentos.html' },
            { title: 'Protocolar', icon: '<path d="M12 4v16m8-8H4"/>', link: 'novo-processo.html' },
            { title: 'Governança', icon: '<path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>', link: 'admin.html' }
        ];

        function cleanNum(v) { if (!v) return 0; if (typeof v === 'number') return v; let s = String(v).replace('R$', '').trim(); if (s.includes(',') && !s.includes('e')) s = s.replace(/\./g, '').replace(',', '.'); return parseFloat(s) || 0; }
        function formatBRL(v) { return cleanNum(v).toLocaleString('pt-br', {style:'currency', currency:'BRL'}); }

        // LÓGICA DE TI SENIOR: Cálculo de Dias Úteis Reais (Business Days Engine v2.0)
        function isHoliday(date) {
            const holidays = [
                '2026-01-01', '2026-02-16', '2026-02-17', '2026-04-03', '2026-04-21',
                '2026-05-01', '2026-06-04', '2026-09-07', '2026-10-12', '2026-11-02',
                '2026-11-15', '2026-11-20', '2026-12-25'
            ];
            // Fix timezone shift for string comparison
            const s = new Date(date.getTime() - (date.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
            return holidays.includes(s);
        }

        function getBusinessDaysDiff(startDate, endDate) {
            let count = 0;
            let curDate = new Date(startDate.getTime());
            curDate.setHours(12, 0, 0, 0);
            const targetDate = new Date(endDate.getTime());
            targetDate.setHours(12, 0, 0, 0);
            
            const isNegative = targetDate < curDate;
            
            if (isNegative) {
                while (curDate > targetDate) {
                    curDate.setDate(curDate.getDate() - 1);
                    if (curDate.getDay() !== 0 && curDate.getDay() !== 6 && !isHoliday(curDate)) count--;
                }
            } else {
                while (curDate < targetDate) {
                    curDate.setDate(curDate.getDate() + 1);
                    if (curDate.getDay() !== 0 && curDate.getDay() !== 6 && !isHoliday(curDate)) count++;
                }
            }
            return count;
        }

        function getAging(dateStr, status) {
            const statusConfig = {
                'Concluído': { label: 'FINALIZADO', class: 'bg-indigo-500/20 text-indigo-400' },
                'Cancelado': { label: 'CANCELADO', class: 'bg-red-900/40 text-red-400' },
                'Devolvido': { label: 'DEVOLVIDO', class: 'bg-rose-500/20 text-rose-400' },
                'Suspenso': { label: 'SUSPENSO', class: 'bg-amber-900/40 text-amber-400' }
            };

            if (statusConfig[status]) return statusConfig[status];
            if (!dateStr || dateStr === 'None' || dateStr === '') return { label: 'S/ PRAZO', class: 'bg-slate-800 text-slate-500' };
            
            try {
                // TI MASTER FIX: Parsing robusto independente de formato ISO ou BR
                let target;
                if (dateStr.includes('/')) {
                    const [d, m, y] = dateStr.split('/');
                    target = new Date(y, m - 1, d, 12, 0, 0);
                } else {
                    const [y, m, d] = dateStr.split('T')[0].split('-');
                    target = new Date(y, m - 1, d, 12, 0, 0);
                }

                const today = new Date();
                today.setHours(12, 0, 0, 0);
                
                const diffDays = getBusinessDaysDiff(today, target);

                if (diffDays < 0) return { label: `Atrasado ${Math.abs(diffDays)} DU`, class: 'bg-red-500/20 text-red-500 border border-red-500/50' };
                if (diffDays <= 2) return { label: `Vence ${diffDays} DU`, class: 'bg-amber-500/20 text-amber-500 border border-amber-500/50' };
                return { label: `SLA OK (${diffDays} DU)`, class: 'bg-emerald-500/20 text-emerald-500' };
            } catch (e) {
                console.error("Erro no processamento de aging:", e);
                return { label: 'ERRO DATA', class: 'bg-red-900 text-white' };
            }
        }

        async function init() {
            try {
                const nav = document.getElementById('globalNav');
                if(nav) nav.innerHTML = menuItems.map(m => `<div class="nav-item ${window.location.pathname.includes(m.link)?'active':''}" onclick="location.href='${m.link}'"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">${m.icon}</svg><span class="tooltip">${m.title}</span></div>`).join('');

                const { data: etapas } = await sb.from('fluxo_etapas').select('*').order('ordem');
                const { data: equipe } = await sb.from('equipe').select('*').order('nome');
                globalEtapas = etapas || []; globalEquipe = equipe || [];

                if (document.getElementById('f-fase')) {
                    globalEtapas.forEach(e => document.getElementById('f-fase').add(new Option(e.descricao, e.descricao)));
                }
                if (document.getElementById('f-responsavel')) {
                    globalEquipe.forEach(r => document.getElementById('f-responsavel').add(new Option(r.nome, r.nome)));
                }

                const { data, error } = await sb.from('licitacoes').select('*').order('id_processo');
                if (error) throw error;
                rawData = data || [];
                
                const fMod = document.getElementById('f-modalidade');
                if (fMod) {
                    const mods = [...new Set(rawData.map(i => i.modalidade).filter(Boolean))].sort();
                    mods.forEach(v => fMod.add(new Option(v, v)));
                }

                updateView(rawData);
            } catch (err) { console.error("Erro Init Dashboard:", err); }
        }

        function runFilters() {
            const s = document.getElementById('searchBox').value.toLowerCase();
            const f = document.getElementById('f-fase').value;
            const r = document.getElementById('f-responsavel').value;
            const m = document.getElementById('f-modalidade').value;
            const st = document.getElementById('f-status').value;
            const filtered = rawData.filter(i => {
                if (s && !(String(i.objeto_resumido||"") + String(i.id_processo||"")).toLowerCase().includes(s)) return false;
                if (f !== 'Todos' && i.fase_atual !== f) return false;
                if (r !== 'Todos' && i.responsavel !== r) return false;
                if (m !== 'Todos' && i.modalidade !== m) return false;
                if (st !== 'Todos' && i.status !== st) return false;
                return true;
            });
            updateView(filtered);
        }

        function filterByField(field, value) { 
            const el = document.getElementById(`f-${field}`);
            if(el) { el.value = value; runFilters(); }
        }
        function clearAllFilters() { 
            document.getElementById('searchBox').value = ''; 
            document.getElementById('f-status').value = 'Todos'; 
            document.getElementById('f-responsavel').value = 'Todos'; 
            document.getElementById('f-modalidade').value = 'Todos'; 
            document.getElementById('f-fase').value = 'Todos'; 
            runFilters(); 
        }

        function updateView(data) {
            const ativos = data.filter(i => i.status !== 'Concluído' && i.status !== 'Cancelado');
            const concluidos = data.filter(i => i.status === 'Concluído');
            const cancelados = data.filter(i => i.status === 'Cancelado');
            
            if(document.getElementById('stat_procs')) document.getElementById('stat_procs').innerText = ativos.length;
            if(document.getElementById('stat_done')) document.getElementById('stat_done').innerText = concluidos.length;
            if(document.getElementById('rowCount')) document.getElementById('rowCount').innerText = `${data.length} PROCESSOS`;
            
            const est = data.reduce((acc, i) => acc + cleanNum(i.vlr_estimado_anual), 0);
            const hom = data.reduce((acc, i) => acc + cleanNum(i.vlr_homologado), 0);
            if(document.getElementById('stat_val')) document.getElementById('stat_val').innerText = formatBRL(est);
            if(document.getElementById('stat_save')) document.getElementById('stat_save').innerText = formatBRL(est - hom);
            
            // CORREÇÃO: Alinhamento do filtro de atrasados com a lógica real de dias úteis
            if(document.getElementById('stat_delay')) {
                const countDelay = ativos.filter(i => {
                    const aging = getAging(i.data_prevista, i.status);
                    return aging.label.includes('Atrasado');
                }).length;
                document.getElementById('stat_delay').innerText = countDelay;
            }
            
            const table = document.getElementById('mainTable');
            if(table) {
                table.innerHTML = data.map(i => {
                    const aging = getAging(i.data_prevista, i.status);
                    const processIdHtml = i.processo_link ? `<a href="${i.processo_link}" target="_blank" onclick="event.stopPropagation()" class="text-blue-400 hover:underline">${i.id_processo}</a>` : i.id_processo;
                    
                    // TI MASTER FIX: Normalização de exibição de data DD/MM/AAAA
                    const formatDateTI = (d) => {
                        if (!d || d === 'None' || d === '') return '-';
                        const parts = d.includes('T') ? d.split('T')[0].split('-') : d.split('-');
                        if (parts.length !== 3) return '-';
                        return `${parts[2]}/${parts[1]}/${parts[0]}`;
                    };

                    const dtPrevStr = formatDateTI(i.data_prevista);
                    const dtFinalStr = formatDateTI(i.data_entrega_final);

                    return `<tr class="row-hover transition cursor-pointer" onclick="openDetails('${i.id_processo}')">
                        <td class="p-4 font-black text-blue-400">${processIdHtml}</td>
                        <td class="p-4">
                            <div class="font-bold text-slate-100 text-sm">${i.fase_atual || 'N/I'}</div>
                            <div class="text-[10px] text-slate-400 uppercase truncate max-w-[200px] font-semibold">${i.objeto_resumido}</div>
                        </td>
                        <td class="p-4 text-center">
                            <span class="aging-badge ${aging.class}">${aging.label}</span>
                            <div class="text-[10px] text-slate-500 mt-1 font-bold">${dtPrevStr}</div>
                        </td>
                        <td class="p-4 text-center font-black text-slate-200 text-sm">
                            ${dtFinalStr}
                        </td>
                        <td class="p-4 text-right font-black text-slate-100 text-sm">${formatBRL(i.vlr_estimado_anual)}</td>
                        <td class="p-4 text-center"><div class="flex justify-center gap-3"><button onclick="event.stopPropagation(); openEdit('${i.id_processo}')" class="p-1 hover:text-blue-400 transition"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg></button><button onclick="event.stopPropagation(); deleteProc('${i.id_processo}')" class="p-1 hover:text-red-500 transition"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button></div></td>
                    </tr>`;
                }).join('');
            }
            renderCharts(ativos);
        }

        function renderCharts(ativos) {
            const countBy = (k) => ativos.reduce((a, i) => { let v = i[k]||'N/I'; a[v]=(a[v]||0)+1; return a; }, {});
            if(charts.mod) charts.mod.destroy();
            const cMod = document.getElementById('chartMod');
            if (cMod) {
                const modData = countBy('modalidade');
                charts.mod = new Chart(cMod, { type: 'doughnut', data: { labels: Object.keys(modData), datasets: [{ data: Object.values(modData), backgroundColor: ['#3b82f6', '#6366f1', '#10b981', '#f59e0b', '#8b5cf6', '#ef4444'], borderWidth: 0 }] }, options: { maintainAspectRatio: false, onClick: (e, activeEls) => { if (activeEls.length > 0) filterByField('modalidade', Object.keys(modData)[activeEls[0].index]); }, plugins: { legend: { display: false } } } });
            }
            if(charts.resp) charts.resp.destroy();
            const cResp = document.getElementById('chartResp');
            if (cResp) {
                const resData = countBy('responsavel');
                const labels = Object.keys(resData).sort((a,b) => (a==='N/I'?1:b==='N/I'?-1:resData[b]-resData[a]));
                charts.resp = new Chart(cResp, { type: 'bar', data: { labels, datasets: [{ data: labels.map(l => resData[l]), backgroundColor: '#3b82f6', borderRadius: 4 }] }, options: { indexAxis: 'y', maintainAspectRatio: false, onClick: (e, activeEls) => { if (activeEls.length > 0) filterByField('responsavel', labels[activeEls[0].index]); }, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { ticks: { color: '#64748b', font: { size: 9 } } } } } });
            }
            if(charts.stat) charts.stat.destroy();
            const cStatus = document.getElementById('chartStatus');
            if (cStatus) {
                const s = { ok: 0, alert: 0, late: 0 };
                ativos.forEach(i => { const l = getAging(i.data_prevista, i.status).label; if(l.includes('OK')) s.ok++; else if(l.includes('Vence')) s.alert++; else if(l.includes('Atrasado')) s.late++; });
                charts.stat = new Chart(cStatus, { type: 'bar', data: { labels: ['SLA OK', 'Alerta', 'Atrasado'], datasets: [{ data: [s.ok, s.alert, s.late], backgroundColor: ['#10b981', '#f59e0b', '#ef4444'], borderRadius: 4 }] }, options: { maintainAspectRatio: false, onClick: (e, activeEls) => { if (activeEls.length > 0) filterByField('prazo', ['No Prazo', 'Alerta', 'Atrasados'][activeEls[0].index]); }, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#94a3b8', font: { size: 9 } } }, y: { display: false } } } });
            }
        }

        function openEdit(id) {
            const item = rawData.find(x => x.id_processo === id);
            const selR = document.getElementById('edit_resp'); selR.innerHTML = ''; globalEquipe.forEach(r => selR.add(new Option(r.nome, r.nome)));
            const selF = document.getElementById('edit_fase'); selF.innerHTML = ''; globalEtapas.forEach(e => selF.add(new Option(e.descricao, e.descricao)));
            document.getElementById('edit_id_pk').value = item.id_processo;
            document.getElementById('edit_proc_id').value = item.id_processo;
            document.getElementById('edit_objeto').value = item.objeto_resumido;
            document.getElementById('edit_link').value = item.processo_link || "";
            document.getElementById('edit_resp').value = item.responsavel || "";
            document.getElementById('edit_fase').value = item.fase_atual || "";
            if(document.getElementById('edit_status')) document.getElementById('edit_status').value = item.status || "Em andamento";
            document.getElementById('edit_dt_prev').value = item.data_prevista ? item.data_prevista.split('T')[0] : "";
            document.getElementById('edit_dt_entrega').value = item.data_entrega_final ? item.data_entrega_final.split('T')[0] : "";
            document.getElementById('edit_val').value = cleanNum(item.vlr_estimado_anual);
            document.getElementById('edit_hom').value = cleanNum(item.vlr_homologado);
            document.getElementById('modalEdit').classList.remove('hidden');
        }

        document.getElementById('editForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSave');
            btn.innerText = "SALVANDO..."; btn.disabled = true;
            try {
                const payload = { 
                    objeto_resumido: document.getElementById('edit_objeto').value, 
                    processo_link: document.getElementById('edit_link').value, 
                    responsavel: document.getElementById('edit_resp').value, 
                    fase_atual: document.getElementById('edit_fase').value, 
                    status: document.getElementById('edit_status').value,
                    data_prevista: document.getElementById('edit_dt_prev').value,
                    data_entrega_final: document.getElementById('edit_dt_entrega').value,
                    vlr_estimado_anual: document.getElementById('edit_val').value, 
                    vlr_homologado: document.getElementById('edit_hom').value 
                };
                await sb.from('licitacoes').update(payload).eq('id_processo', document.getElementById('edit_id_pk').value);
                location.reload();
            } catch (err) { alert("Erro."); btn.innerText = "SALVAR"; btn.disabled = false; }
        }

        function openDetails(id) {
            const item = rawData.find(x => x.id_processo === id);
            document.getElementById('modalContent').innerHTML = `<h2 class="text-2xl font-black mb-4 uppercase text-white">${item.id_processo}</h2><div class="glass-card p-6 bg-white/5 border-white/10 mb-6"><p class="text-[9px] font-black text-blue-400 uppercase tracking-widest mb-2">Objeto</p><p class="text-sm font-medium leading-relaxed">${item.objeto_resumido}</p></div><div class="grid grid-cols-2 gap-4"><div class="p-4 bg-white/5 rounded-xl border border-white/5"><p class="text-[9px] font-bold text-slate-500 uppercase mb-1">Responsável</p><p class="font-black text-xs">${item.responsavel||'N/I'}</p></div><div class="p-4 bg-white/5 rounded-xl border border-white/5"><p class="text-[9px] font-bold text-slate-500 uppercase mb-1">Fase SLA</p><p class="font-black text-xs text-indigo-400">${item.fase_atual||'N/I'}</p></div></div>`;
            const btn = document.getElementById('btnSEI'); if(item.processo_link) { btn.classList.remove('hidden'); btn.onclick = () => window.open(item.processo_link, '_blank'); } else btn.classList.add('hidden');
            document.getElementById('modalDetails').classList.remove('hidden');
        }

        function deleteProc(id) { if(confirm(`Excluir ${id}?`)) { sb.from('licitacoes').delete().eq('id_processo', id).then(() => location.reload()); } }
        function closeEdit() { document.getElementById('modalEdit').classList.add('hidden'); }
        function closeDetails() { document.getElementById('modalDetails').classList.add('hidden'); }
        window.onload = init;
    </script>
</body>
</html>
