<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgSUS PCM | Gestão de Compras</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --glass: rgba(30, 41, 59, 0.7); }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at top left, #0f172a, #020617); color: #f8fafc; margin: 0; overflow: hidden; }
        .glass-card { background: var(--glass); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .nav-item { transition: all 0.2s; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 12px; margin-bottom: 12px; color: #94a3b8; }
        .nav-item:hover, .nav-item.active { background: rgba(59, 130, 246, 0.1); color: #3b82f6; }
        .main-content { height: 100vh; overflow-y: auto; }
        .aging-badge { font-size: 8px; padding: 2px 6px; border-radius: 4px; font-weight: 900; text-transform: uppercase; white-space: nowrap; }
        .aging-red { background-color: #ef4444; color: white; }
        .aging-yellow { background-color: #eab308; color: black; }
        .aging-green { background-color: #22c55e; color: white; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="flex">

    <!-- BARRA LATERAL -->
    <aside class="w-20 h-screen glass-card border-r border-white/5 flex flex-col items-center py-8 z-50">
        <div class="mb-10 text-blue-500"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg></div>
        <nav class="flex flex-col flex-1">
            <div class="nav-item active" onclick="location.href='index.html'"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></div>
            <div class="nav-item" onclick="location.href='novo-processo.html'"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"/></svg></div>
            <div class="nav-item opacity-30"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg></div>
        </nav>
    </aside>

    <main class="flex-1 main-content p-8">
        <header class="mb-10 flex justify-between items-end">
            <div>
                <p class="text-xs font-medium text-blue-400 uppercase tracking-widest mb-1">AgSUS PCM SaaS</p>
                <h1 class="text-3xl font-extrabold tracking-tight uppercase">Fluxo de Execução Real</h1>
            </div>
            <div class="flex gap-4">
                <button onclick="location.href='novo-processo.html'" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-2xl text-xs font-black uppercase tracking-widest transition shadow-lg shadow-blue-500/20">+ Novo Processo</button>
            </div>
        </header>

        <!-- CARDS DINÂMICOS -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
            <div class="glass-card p-6 rounded-2xl"><p class="text-[10px] font-bold text-slate-500 uppercase mb-1">Processos Totais</p><h3 id="totalCount" class="text-4xl font-extrabold">--</h3></div>
            <div class="glass-card p-6 rounded-2xl"><p class="text-[10px] font-bold text-slate-500 uppercase mb-1">Valor Estimado</p><h3 id="totalValue" class="text-2xl font-extrabold text-slate-100">R$ 0,00</h3></div>
            <div class="glass-card p-6 rounded-2xl"><p class="text-[10px] font-bold text-emerald-500 uppercase mb-1">Economia CCS</p><h3 id="totalSaving" class="text-2xl font-extrabold text-emerald-400">R$ 0,00</h3></div>
            <div class="glass-card p-6 rounded-2xl border-l-4 border-l-red-500"><p class="text-[10px] font-bold text-red-500 uppercase mb-1">Em Atraso</p><h3 id="overdueCount" class="text-4xl font-extrabold text-red-100">--</h3></div>
        </div>

        <!-- TABELA CONECTADA AO BANCO -->
        <div class="glass-card rounded-2xl overflow-hidden shadow-2xl">
            <div class="p-6 border-b border-white/5 flex justify-between items-center">
                <h2 class="text-sm font-bold uppercase tracking-widest text-slate-400">Processos Licitatórios</h2>
            </div>
            <div class="overflow-x-hidden">
                <table class="w-full text-left table-fixed">
                    <thead class="bg-slate-900/50">
                        <tr class="text-[9px] font-black uppercase text-slate-500 border-b border-white/10 tracking-tighter">
                            <th class="w-[20%] px-6 py-4">ID Processo</th>
                            <th class="w-[30%] px-6 py-4">Fase Atual</th>
                            <th class="w-[15%] px-6 py-4 text-center">Prazo Tarefa</th>
                            <th class="w-[15%] px-6 py-4 text-center">Entrega Final</th>
                            <th class="w-[20%] px-6 py-4 text-right">Vlr Estimado</th>
                        </tr>
                    </thead>
                    <tbody id="procTable" class="text-[10px] divide-y divide-white/5">
                        <!-- Dados carregados via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = "https://qakrpkwmhlpynrphucfl.supabase.co";
        const SUPABASE_KEY = "sb_publishable_GO7Aqg_eNO6hqUIl3rAzyg_GRuiIkWE";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function cleanNum(v) { return v ? parseFloat(String(v)) || 0 : 0; }
        function formatBRL(v) { return v.toLocaleString('pt-br', {style:'currency', currency:'BRL'}); }
        function formatDate(d) { if(!d) return '-'; const p = d.split('-'); return `${p[2]}/${p[1]}/${p[0]}`; }

        async function loadData() {
            const { data, error } = await sb.from('licitacoes').select('*').order('created_at', { ascending: false });
            if (error) return;

            document.getElementById('totalCount').innerText = data.length;
            const sumEst = data.reduce((acc, i) => acc + cleanNum(i.vlr_estimado_anual), 0);
            const sumHom = data.reduce((acc, i) => acc + cleanNum(i.vlr_homologado), 0);
            document.getElementById('totalValue').innerText = formatBRL(sumEst);
            document.getElementById('totalSaving').innerText = formatBRL(sumEst > 0 && sumHom > 0 ? sumEst - sumHom : 0);

            const table = document.getElementById('procTable');
            table.innerHTML = data.map(i => {
                const match = i.observacoes ? i.observacoes.match(/<!--METADATA_DATES:ATIV=(.*)\|FINAL=(.*)-->/) : null;
                const deadline = match ? match[2] : i.data_prevista;
                return `
                <tr class="hover:bg-white/5 transition">
                    <td class="px-6 py-4 font-bold text-blue-400">${i.processo_link ? `<a href="${i.processo_link}" target="_blank" class="hover:underline">${i.id_processo}</a>` : i.id_processo}</td>
                    <td class="px-6 py-4"><div class="font-bold text-slate-100">${i.fase_atual || 'Não Iniciado'}</div><div class="text-[8px] text-slate-500 uppercase">${i.objeto_resumido}</div></td>
                    <td class="px-6 py-4 text-center"><span class="aging-badge aging-green">No Prazo</span></td>
                    <td class="px-6 py-4 text-center text-slate-300 font-bold">${formatDate(deadline)}</td>
                    <td class="px-6 py-4 text-right font-bold text-slate-100">${formatBRL(cleanNum(i.vlr_estimado_anual))}</td>
                </tr>`;
            }).join('');
        }
        loadData();
    </script>
</body>
</html>
