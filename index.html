<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgSUS PCM | Gestão Estratégica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="flex h-screen bg-slate-950">

    <!-- Sidebar -->
    <aside class="w-64 border-r border-border bg-slate-900 hidden md:flex flex-col p-6 sidebar">
        <h2 class="text-xl font-black mb-10 text-white tracking-tighter uppercase">AgSUS PCM</h2>
        <nav class="space-y-4">
            <a href="#" class="block text-blue-400 font-bold text-sm">Dashboard</a>
            <a href="#" class="block text-slate-400 hover:text-white transition font-medium text-sm">Licitações</a>
            <a href="#" class="block text-slate-400 hover:text-white transition font-medium text-sm">Processos</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-8">
        <header class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-2xl font-black uppercase tracking-tight text-white">Gestão Estratégica</h1>
                <p class="text-slate-500 text-xs font-medium">Monitoramento de Licitações</p>
            </div>
            <button class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-2xl text-xs font-bold uppercase tracking-widest transition shadow-lg shadow-blue-500/20">
                + Novo Processo
            </button>
        </header>

        <!-- Stats -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
            <div class="glass-card p-6">
                <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">Ativos</p>
                <h3 id="totalProcessos" class="text-3xl font-black text-white">-</h3>
            </div>
            <div class="glass-card p-6">
                <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">Valor Estimado</p>
                <h3 id="vlrEstimado" class="text-xl font-black text-white">R$ 0,00</h3>
            </div>
        </div>

        <!-- Filters -->
        <div class="glass-card p-4 mb-8 flex gap-4">
            <input type="text" id="search" placeholder="Buscar por ID ou Objeto..." class="bg-slate-900/50 px-4 py-3 rounded-xl text-xs text-slate-300 w-full outline-none border border-slate-700">
            <select id="statusFilter" class="bg-slate-900/50 px-4 py-3 rounded-xl text-xs text-slate-300 border border-slate-700">
                <option value="Todos">Status</option>
            </select>
        </div>

        <!-- Table -->
        <div class="glass-card p-6 overflow-hidden">
            <table class="w-full text-sm text-left">
                <thead class="text-[10px] text-slate-400 uppercase tracking-wider border-b border-white/5">
                    <tr>
                        <th class="p-4">Processo</th>
                        <th class="p-4">Objeto</th>
                        <th class="p-4">Status</th>
                        <th class="p-4 text-right">Valor</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="divide-y divide-white/5"></tbody>
            </table>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
