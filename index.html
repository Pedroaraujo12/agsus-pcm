<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgSUS PCM | Gestão Estratégica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --glass: rgba(15, 23, 42, 0.85); --accent: #3b82f6; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; color: #f8fafc; margin: 0; min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        @media (min-width: 1024px) { body { flex-direction: row; } }
        
        .glass-card { background: var(--glass); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08); border-radius: 1rem; }
        
        .sidebar { width: 100%; height: auto; display: flex; flex-direction: row; align-items: center; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 100; justify-content: space-around; flex-shrink: 0; background: #0f172a; }
        @media (min-width: 1024px) { .sidebar { width: 72px; height: 100vh; flex-direction: column; border-right: 1px solid rgba(255,255,255,0.05); border-bottom: none; padding: 24px 0; justify-content: flex-start; } }
        
        .nav-item { position: relative; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; margin-bottom: 12px; color: #64748b; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .nav-item:hover, .nav-item.active { color: #ffffff; background: var(--accent); box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }
        
        .nav-item .tooltip { visibility: hidden; position: absolute; background: #1e293b; color: white; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; white-space: nowrap; border: 1px solid rgba(255,255,255,0.1); z-index: 1000; opacity: 0; transition: all 0.2s ease; pointer-events: none; }
        @media (min-width: 1024px) { .nav-item .tooltip { left: 140%; top: 50%; transform: translateY(-50%); } .nav-item:hover .tooltip { visibility: visible; opacity: 1; } }

        .main-content { flex: 1; padding: 24px; overflow-y: auto; height: 100vh; }
        .status-badge { font-size: 9px; padding: 3px 8px; border-radius: 20px; font-weight: 800; text-transform: uppercase; border: 1px solid rgba(255,255,255,0.1); }
        .aging-badge { font-size: 8px; padding: 3px 8px; border-radius: 4px; font-weight: 900; text-transform: uppercase; }
        
        .btn-primary { background: var(--accent); color: white; padding: 10px 20px; border-radius: 8px; font-size: 12px; font-weight: 700; transition: all 0.2s; display: inline-flex; items-center; gap: 8px; }
        .btn-primary:hover { background: #2563eb; transform: translateY(-1px); }
        .input-base { background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; padding: 8px 12px; color: white; font-size: 13px; outline: none; transition: border 0.2s; width: 100%; }
        
        .clickable-card { cursor: pointer; transition: transform 0.2s; }
        .clickable-card:hover { transform: translateY(-3px); border-color: var(--accent); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="hidden lg:flex mb-10 text-blue-500 scale-125"><svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg></div>
        <nav id="globalNav" class="flex flex-row lg:flex-col"></nav>
    </aside>

    <main class="main-content">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-10">
            <div>
                <h1 class="text-3xl font-black tracking-tight uppercase italic">Dashboard PCM</h1>
                <p class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.3em] mt-1">Gestão Estratégica AgSUS</p>
            </div>
            <div class="flex gap-3">
                <button onclick="location.reload()" class="input-base px-6 font-bold uppercase text-[10px]">Sincronizar</button>
                <button onclick="location.href='novo-processo.html'" class="btn-primary">+ Novo Registro</button>
            </div>
        </header>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
            <div class="glass-card p-6 border-l-4 border-blue-500 clickable-card" onclick="filterByPrazo('Todos')">
                <p class="text-[10px] font-bold text-slate-500 uppercase mb-1">Processos</p>
                <h3 id="stat_procs" class="text-3xl font-black">--</h3>
            </div>
            <div class="glass-card p-6 border-l-4 border-indigo-500">
                <p class="text-[10px] font-bold text-slate-500 uppercase mb-1">Total Estimado</p>
                <h3 id="stat_val" class="text-xl font-black">R$ 0,00</h3>
            </div>
            <div class="glass-card p-6 border-l-4 border-emerald-500">
                <p class="text-[10px] font-bold text-emerald-500 uppercase mb-1">Savings</p>
                <h3 id="stat_save" class="text-xl font-black text-emerald-400">R$ 0,00</h3>
            </div>
            <div class="glass-card p-6 border-l-4 border-red-500 clickable-card" onclick="filterByPrazo('Atrasados')">
                <p class="text-[10px] font-bold text-red-500 uppercase mb-1">Atrasos</p>
                <h3 id="stat_delay" class="text-3xl font-black text-red-100">--</h3>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 space-y-4">
                <div class="glass-card p-4 flex flex-wrap gap-3">
                    <input type="text" id="searchBox" onkeyup="runFilters()" placeholder="ID ou Objeto..." class="input-base flex-1 min-w-[150px]">
                    <select id="f-fase" onchange="runFilters()" class="input-base min-w-[150px]"><option value="Todos">Etapa (SLA)</option></select>
                    <select id="f-responsavel" onchange="runFilters()" class="input-base min-w-[150px]"><option value="Todos">Responsável</option></select>
                    <button onclick="clearAllFilters()" class="text-[9px] font-black text-slate-500 hover:text-white uppercase px-2">Limpar</button>
                </div>
                
                <div class="glass-card overflow-hidden">
                    <div class="p-4 border-b border-white/5 flex justify-between items-center"><h2 class="text-[10px] font-black uppercase text-slate-400">Fluxo de Execução</h2><span id="rowCount" class="text-[9px] bg-slate-800 px-2 py-1 rounded text-slate-500 font-black italic"></span></div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-slate-900/50"><tr class="text-[9px] font-black uppercase text-slate-500"><th class="p-4">ID Processo</th><th>Etapa / Objeto</th><th class="text-center">SLA</th><th class="text-right">Estimado</th><th class="text-center">Ações</th></tr></thead>
                            <tbody id="mainTable" class="text-[10px] divide-y divide-white/5"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="space-y-6">
                <div class="glass-card p-6 h-[230px]"><h3 class="text-[10px] font-black uppercase text-slate-500 mb-4">Saúde dos Prazos</h3><canvas id="chartStatus"></canvas></div>
                <div class="glass-card p-6 h-[230px]"><h3 class="text-[10px] font-black uppercase text-slate-500 mb-4">Modalidades</h3><canvas id="chartMod"></canvas></div>
                <div class="glass-card p-6 h-[230px]"><h3 class="text-[10px] font-black uppercase text-slate-500 mb-4">Carga da Equipe</h3><canvas id="chartResp"></canvas></div>
            </div>
        </div>
    </main>

    <!-- MODAL EDITAR -->
    <div id="modalEdit" class="fixed inset-0 bg-slate-950/90 backdrop-blur-sm hidden z-[250] flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-lg shadow-2xl border border-white/10 overflow-hidden">
            <div class="bg-blue-600 p-6 flex justify-between items-center text-white"><h2 class="text-sm font-black uppercase tracking-widest">Editar Processo</h2><button onclick="closeEdit()" class="text-2xl">&times;</button></div>
            <form id="editForm" class="p-8 space-y-4">
                <input type="hidden" id="edit_id_pk">
                <div><label class="text-[9px] font-black text-slate-500 uppercase mb-1">Objeto</label><textarea id="edit_objeto" rows="2" class="input-base"></textarea></div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="text-[9px] font-black text-slate-500 uppercase mb-1">Responsável</label><select id="edit_resp" class="input-base"></select></div>
                    <div><label class="text-[9px] font-black text-slate-500 uppercase mb-1">Etapa Atual</label><select id="edit_fase" class="input-base"></select></div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="text-[9px] font-black text-slate-500 uppercase mb-1">Estimado</label><input type="number" step="0.01" id="edit_val" class="input-base"></div>
                    <div><label class="text-[9px] font-black text-slate-500 uppercase mb-1">Homologado</label><input type="number" step="0.01" id="edit_hom" class="input-base"></div>
                </div>
                <button type="submit" class="w-full btn-primary py-4 mt-2">Salvar Alterações</button>
            </form>
        </div>
    </div>

    <!-- MODAL DETALHES -->
    <div id="modalDetails" class="fixed inset-0 bg-slate-950/90 backdrop-blur-sm hidden z-[200] flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-xl shadow-2xl border border-white/10 overflow-hidden">
            <div class="p-8" id="detContent"></div>
            <div class="p-6 border-t border-white/5 flex justify-end gap-3">
                <button id="btnSEI" class="hidden btn-primary text-[10px]">Abrir no SEI</button>
                <button onclick="closeDetails()" class="input-base max-w-[100px] text-[10px] font-bold uppercase">Fechar</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://qakrpkwmhlpynrphucfl.supabase.co";
        const SUPABASE_KEY = "sb_publishable_GO7Aqg_eNO6hqUIl3rAzyg_GRuiIkWE";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let rawData = [], charts = {}, globalEtapas = [], globalEquipe = [];

        const menuItems = [
            { title: 'Dashboard', icon: '<path d="M4 6h16M4 12h16M4 18h16"/>', link: 'index.html' },
            { title: 'Protocolar', icon: '<path d="M12 4v16m8-8H4"/>', link: 'novo-processo.html' },
            { title: 'Governança', icon: '<path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>', link: 'admin.html' }
        ];

        function formatBRL(v) { return parseFloat(v||0).toLocaleString('pt-br', {style:'currency', currency:'BRL'}); }
        
        function getAging(dateStr) {
            if (!dateStr || dateStr === 'None') return { label: 'N/A', class: 'text-slate-600' };
            const target = new Date(dateStr.includes('/') ? dateStr.split('/').reverse().join('-') : dateStr);
            const today = new Date(); today.setHours(0,0,0,0);
            const diff = Math.ceil((target - today) / 86400000);
            if (diff < 0) return { label: `Atrasado ${Math.abs(diff)}d`, class: 'bg-red-500/10 text-red-500' };
            if (diff <= 2) return { label: `Alerta ${diff}d`, class: 'bg-amber-500/10 text-amber-500' };
            return { label: `SLA OK`, class: 'bg-emerald-500/10 text-emerald-500' };
        }

        async function init() {
            const nav = document.getElementById('globalNav');
            nav.innerHTML = menuItems.map(m => `<div class="nav-item ${window.location.pathname.includes(m.link)?'active':''}" onclick="location.href='${m.link}'"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">${m.icon}</svg><span class="tooltip">${m.title}</span></div>`).join('');

            const { data: etapas } = await sb.from('fluxo_etapas').select('*').order('ordem');
            const { data: equipe } = await sb.from('equipe').select('*').order('nome');
            globalEtapas = etapas || []; globalEquipe = equipe || [];

            const fFase = document.getElementById('f-fase');
            globalEtapas.forEach(e => fFase.add(new Option(e.descricao, e.descricao)));
            const fResp = document.getElementById('f-responsavel');
            globalEquipe.forEach(r => fResp.add(new Option(r.nome, r.nome)));

            const { data } = await sb.from('licitacoes').select('*').order('id_processo');
            rawData = data || [];
            updateView(rawData);
        }

        function runFilters() {
            const s = document.getElementById('searchBox').value.toLowerCase();
            const f = document.getElementById('f-fase').value;
            const r = document.getElementById('f-responsavel').value;
            const p = document.getElementById('f-prazo')?.value || 'Todos';

            const filtered = rawData.filter(i => {
                if (s && !(String(i.objeto_resumido||"") + String(i.id_processo||"")).toLowerCase().includes(s)) return false;
                if (f !== 'Todos' && i.fase_atual !== f) return false;
                if (r !== 'Todos' && i.responsavel !== r) return false;
                if (p === 'Atrasados' && getAging(i.data_prevista).label.indexOf('Atrasado') === -1) return false;
                return true;
            });
            updateView(filtered);
        }

        function filterByPrazo(type) {
            const mock = { value: type };
            // Lógica interna de filtro por clique no card
            const filtered = rawData.filter(i => {
                if(type === 'Atrasados') return getAging(i.data_prevista).label.includes('Atrasado');
                return true;
            });
            updateView(filtered);
        }

        function clearAllFilters() {
            document.getElementById('searchBox').value = '';
            document.getElementById('f-fase').value = 'Todos';
            document.getElementById('f-responsavel').value = 'Todos';
            updateView(rawData);
        }

        function updateView(data) {
            document.getElementById('stat_procs').innerText = data.length;
            document.getElementById('rowCount').innerText = `${data.length} PROCESSOS ENCONTRADOS`;
            const est = data.reduce((acc, i) => acc + parseFloat(i.vlr_estimado_anual||0), 0);
            const hom = data.reduce((acc, i) => acc + parseFloat(i.vlr_homologado||0), 0);
            document.getElementById('stat_val').innerText = formatBRL(est);
            document.getElementById('stat_save').innerText = formatBRL(est - hom);
            document.getElementById('stat_delay').innerText = data.filter(i => getAging(i.data_prevista).label.includes('Atrasado')).length;

            const table = document.getElementById('mainTable');
            table.innerHTML = data.map(i => {
                const aging = getAging(i.data_prevista);
                const linkIcon = i.processo_link ? `<svg class="w-3 h-3 inline text-blue-500 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>` : '';
                return `
                <tr class="hover:bg-white/5 transition cursor-pointer" onclick="openDetails('${i.id_processo}')">
                    <td class="p-4 font-black text-blue-400">${i.id_processo}${linkIcon}</td>
                    <td class="p-4"><div class="font-bold text-slate-100">${i.fase_atual || '-'}</div><div class="text-[8px] text-slate-500 uppercase tracking-tighter truncate max-w-[250px]">${i.objeto_resumido}</div></td>
                    <td class="p-4 text-center"><span class="aging-badge ${aging.class}">${aging.label}</span></td>
                    <td class="p-4 text-right font-black text-slate-100">${formatBRL(i.vlr_estimado_anual)}</td>
                    <td class="p-4 text-center">
                        <div class="flex justify-center gap-2">
                            <button onclick="event.stopPropagation(); openEdit('${i.id_processo}')" class="p-1 hover:text-blue-400"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg></button>
                            <button onclick="event.stopPropagation(); deleteProc('${i.id_processo}')" class="p-1 hover:text-red-500"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>
                        </div>
                    </td>
                </tr>`;
            }).join('');
            renderCharts(data);
        }

        function renderCharts(data) {
            const countBy = (k) => data.reduce((a, i) => { let v = i[k]||'N/I'; a[v]=(a[v]||0)+1; return a; }, {});
            
            if(charts.mod) charts.mod.destroy();
            const modData = countBy('modalidade');
            charts.mod = new Chart(document.getElementById('chartMod'), {
                type: 'doughnut', data: { labels: Object.keys(modData), datasets: [{ data: Object.values(modData), backgroundColor: ['#3b82f6', '#6366f1', '#10b981', '#f59e0b'], borderWidth: 0 }] },
                options: { maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { color: '#94a3b8', font: { size: 9 }, usePointStyle: true } } } }
            });

            if(charts.resp) charts.resp.destroy();
            const resData = countBy('responsavel');
            charts.resp = new Chart(document.getElementById('chartResp'), {
                type: 'bar', data: { labels: Object.keys(resData), datasets: [{ data: Object.values(resData), backgroundColor: '#3b82f6', borderRadius: 4 }] },
                options: { indexAxis: 'y', maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { ticks: { color: '#94a3b8', font: { size: 9 } } } } }
            });

            if(charts.stat) charts.stat.destroy();
            const s = { ok: 0, alert: 0, late: 0 };
            data.forEach(i => { const l = getAging(i.data_prevista).label; if(l.includes('OK')) s.ok++; else if(l.includes('Alerta')) s.alert++; else s.late++; });
            charts.stat = new Chart(document.getElementById('chartStatus'), {
                type: 'bar', data: { labels: ['SLA OK', 'Alerta', 'Atrasado'], datasets: [{ data: [s.ok, s.alert, s.late], backgroundColor: ['#10b981', '#f59e0b', '#ef4444'], borderRadius: 4 }] },
                options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#94a3b8', font: { size: 9 } } }, y: { display: false } } }
            });
        }

        function openEdit(id) {
            const item = rawData.find(x => x.id_processo === id);
            const selR = document.getElementById('edit_resp'); selR.innerHTML = ''; globalEquipe.forEach(r => selR.add(new Option(r.nome, r.nome)));
            const selF = document.getElementById('edit_fase'); selF.innerHTML = ''; globalEtapas.forEach(e => selF.add(new Option(e.descricao, e.descricao)));
            document.getElementById('edit_id_pk').value = item.id_processo;
            document.getElementById('edit_objeto').value = item.objeto_resumido;
            document.getElementById('edit_resp').value = item.responsavel;
            document.getElementById('edit_fase').value = item.fase_atual;
            document.getElementById('edit_val').value = item.vlr_estimado_anual;
            document.getElementById('edit_hom').value = item.vlr_homologado;
            document.getElementById('modalEdit').classList.remove('hidden');
        }

        document.getElementById('editForm').onsubmit = async (e) => {
            e.preventDefault();
            const payload = { objeto_resumido: document.getElementById('edit_objeto').value, responsavel: document.getElementById('edit_resp').value, fase_atual: document.getElementById('edit_fase').value, vlr_estimado_anual: document.getElementById('edit_val').value, vlr_homologado: document.getElementById('edit_hom').value };
            await sb.from('licitacoes').update(payload).eq('id_processo', document.getElementById('edit_id_pk').value);
            location.reload();
        }

        function openDetails(id) {
            const item = rawData.find(x => x.id_processo === id);
            document.getElementById('detContent').innerHTML = `<h2 class="text-2xl font-black mb-4 uppercase">${item.id_processo}</h2><div class="glass-card p-6 bg-white/5 mb-6"><p class="text-[9px] font-black text-blue-500 uppercase tracking-widest mb-2">Objeto</p><p class="text-sm font-medium leading-relaxed">${item.objeto_resumido}</p></div><div class="grid grid-cols-2 gap-4"><div class="p-4 bg-white/5 rounded-xl"><p class="text-[9px] font-bold text-slate-500 uppercase mb-1">Responsável</p><p class="font-black text-xs">${item.responsavel||'N/I'}</p></div><div class="p-4 bg-white/5 rounded-xl"><p class="text-[9px] font-bold text-slate-500 uppercase mb-1">Status</p><p class="font-black text-xs text-indigo-400">${item.status}</p></div></div>`;
            const btn = document.getElementById('btnSEI'); if(item.processo_link) { btn.classList.remove('hidden'); btn.onclick = () => window.open(item.processo_link, '_blank'); } else btn.classList.add('hidden');
            document.getElementById('modalDetails').classList.remove('hidden');
        }

        function deleteProc(id) { if(confirm(`Excluir ${id}?`)) { sb.from('licitacoes').delete().eq('id_processo', id).then(() => location.reload()); } }
        function closeEdit() { document.getElementById('modalEdit').classList.add('hidden'); }
        function closeDetails() { document.getElementById('modalDetails').classList.add('hidden'); }
        window.onload = init;
    </script>
</body>
</html>
