<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgSUS PCM | Gestão de Contratos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-deep: #000000;
            --glass: rgba(18, 18, 18, 0.7); 
            --accent: #3b82f6; 
            --glow: rgba(59, 130, 246, 0.3);
        }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: radial-gradient(circle at 0% 0%, #0f172a 0%, #000000 50%),
                        radial-gradient(circle at 100% 100%, #1e1b4b 0%, #000000 50%);
            color: #f8fafc; 
            margin: 0; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow-x: hidden; 
            overflow-y: auto; 
        }
        @media (min-width: 1024px) { body { flex-direction: row; } }
        
        .glass-card { 
            background: var(--glass); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.08); 
            border-radius: 1.5rem; 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }
        
        .sidebar { 
            width: 100%; 
            height: auto; 
            display: flex; 
            flex-direction: row; 
            align-items: center; 
            padding: 12px; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
            z-index: 100; 
            justify-content: space-around; 
            flex-shrink: 0; 
            background: rgba(0, 0, 0, 0.9); 
        }
        @media (min-width: 1024px) { 
            .sidebar { 
                width: 80px; 
                height: 100vh; 
                flex-direction: column; 
                border-right: 1px solid rgba(255,255,255,0.05); 
                border-bottom: none; 
                padding: 24px 0; 
                justify-content: flex-start; 
                position: sticky; 
                top: 0; 
            } 
        }
        
        .nav-item { 
            position: relative; 
            width: 48px; 
            height: 48px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 14px; 
            margin-bottom: 12px; 
            color: #64748b; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            cursor: pointer; 
        }
        .nav-item:hover, .nav-item.active { 
            color: #ffffff; 
            background: var(--accent); 
            box-shadow: 0 0 20px var(--glow); 
            transform: scale(1.05); 
        }
        @media (min-width: 1024px) {
            .nav-item .tooltip { 
                visibility: hidden; 
                position: absolute; 
                background: #111; 
                color: white; 
                padding: 6px 12px; 
                border-radius: 8px; 
                font-size: 11px; 
                font-weight: 800; 
                text-transform: uppercase; 
                white-space: nowrap; 
                border: 1px solid rgba(255,255,255,0.1); 
                z-index: 1000; 
                opacity: 0; 
                transition: 0.2s; 
                pointer-events: none; 
                left: 140%; 
                top: 50%; 
                transform: translateY(-50%); 
            }
            .nav-item:hover .tooltip { visibility: visible; opacity: 1; }
        }
        
        .main-container { flex: 1; padding: 16px; overflow-y: auto; width: 100%; }
        @media (min-width: 1024px) { .main-container { padding: 32px; } }
        
        .contract-timeline { border-left: 2px solid rgba(255,255,255,0.05); margin-left: 10px; padding-left: 20px; }
        .timeline-node { position: relative; margin-bottom: 25px; }
        .timeline-node::before { content: ""; position: absolute; left: -27px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: #3b82f6; border: 3px solid #000; }
        .timeline-node.aditivo::before { background: #f59e0b; }
        
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #222; border-radius: 10px; }
    </style>
</head>
<body class="flex">

    <aside class="sidebar">
        <div class="hidden lg:flex mb-10 text-blue-500 scale-110"><svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg></div>
        <nav id="globalNav" class="flex flex-row lg:flex-col gap-2"></nav>
    </aside>

    <main class="main-container">
        <header class="mb-10 flex flex-col md:flex-row justify-between items-start md:items-end gap-6">
            <div class="w-full">
                <p class="text-[10px] font-medium text-blue-400 uppercase tracking-widest mb-1">Módulo de Execução 360º</p>
                <h1 class="text-2xl md:text-3xl font-black uppercase tracking-tight leading-none">Gestão de Contratos</h1>
            </div>
            <button onclick="document.getElementById('modalContrato').classList.remove('hidden')" class="w-full md:w-auto bg-blue-600 hover:bg-blue-500 text-white px-8 py-4 rounded-2xl text-xs font-black uppercase tracking-widest transition shadow-lg shadow-blue-500/30">+ Novo Contrato</button>
        </header>

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="glass-card p-6"><p class="text-[10px] font-bold text-slate-500 uppercase mb-1">Contratos Ativos</p><h3 id="stat_total" class="text-2xl md:text-3xl font-black">--</h3></div>
            <div class="glass-card p-6"><p class="text-[10px] font-bold text-slate-500 uppercase mb-1">Valor Contratado</p><h3 id="stat_val" class="text-lg font-black truncate">R$ 0,00</h3></div>
            <div class="glass-card p-6 text-emerald-400"><p class="text-[10px] font-bold text-emerald-500/50 uppercase mb-1">Execução Média</p><h3 id="stat_exec" class="text-2xl md:text-3xl font-black">--%</h3></div>
            <div class="glass-card p-6 border-l-4 border-l-amber-500 text-amber-100"><p class="text-[10px] font-bold text-amber-500 uppercase mb-1">Vencimento < 60d</p><h3 id="stat_alert" class="text-2xl md:text-3xl font-black">--</h3></div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 glass-card overflow-hidden">
                <div class="p-6 border-b border-white/5 flex justify-between items-center bg-white/5">
                    <h2 class="text-xs font-bold uppercase text-slate-400 tracking-widest">Contratos Registrados</h2>
                    <span id="rowCount" class="text-[9px] font-bold bg-slate-800 px-3 py-1 rounded-full text-slate-500">-- registros</span>
                </div>
                <div class="overflow-x-auto p-6">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="text-[9px] font-black uppercase text-slate-500 tracking-wider border-b border-white/10">
                                <th class="pb-4">Nº Contrato</th>
                                <th class="pb-4">Fornecedor / Objeto</th>
                                <th class="pb-4 text-right">Valor Global</th>
                            </tr>
                        </thead>
                        <tbody id="contratoTable" class="text-[11px] divide-y divide-white/5"></tbody>
                    </table>
                </div>
            </div>

            <div class="space-y-6">
                <div id="timelinePanel" class="glass-card p-6 hidden">
                    <h2 class="text-[10px] font-black uppercase tracking-widest text-blue-400 mb-6">Histórico: <span id="selCT" class="text-white">--</span></h2>
                    <div id="timelineContent" class="contract-timeline"></div>
                </div>
                <div class="glass-card p-6 h-[250px]"><h2 class="text-[10px] font-bold uppercase text-indigo-400 mb-4 text-center">Volume por Fornecedor</h2><canvas id="chartForn"></canvas></div>
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div id="modalContrato" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md hidden z-[200] flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-lg overflow-hidden shadow-2xl">
            <div class="bg-blue-600 px-8 py-6 flex justify-between items-center"><h2 class="text-sm font-black uppercase tracking-widest text-white">Cadastrar Contrato</h2><button onclick="document.getElementById('modalContrato').classList.add('hidden')" class="text-white opacity-50">&times;</button></div>
            <form id="contractForm" class="p-8 space-y-4">
                <div><label class="text-[9px] font-black text-slate-500 uppercase block mb-1">Processo Origem</label><select id="ct_proc" class="form-input"></select></div>
                <div><label class="text-[9px] font-black text-slate-500 uppercase block mb-1">Fornecedor</label><select id="ct_forn" class="form-input"></select></div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="text-[9px] font-black text-slate-500 uppercase block mb-1">Nº Contrato</label><input type="text" id="ct_num" required class="form-input"></div>
                    <div><label class="text-[9px] font-black text-slate-500 uppercase block mb-1">Valor Global</label><input type="number" step="0.01" id="ct_valor" required class="form-input"></div>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-2xl uppercase text-xs tracking-widest transition mt-4">Salvar no Banco</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://qakrpkwmhlpynrphucfl.supabase.co";
        const SUPABASE_KEY = "sb_publishable_GO7Aqg_eNO6hqUIl3rAzyg_GRuiIkWE";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let charts = {};

        const menuItems = [
            { title: 'Dashboard', icon: '<path d="M4 6h16M4 12h16M4 18h16"/>', link: 'index.html' },
            { title: 'Editais', icon: '<path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>', link: 'editais.html' },
            { title: 'Propostas', icon: '<path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>', link: 'propostas.html' },
            { title: 'Contratos', icon: '<path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>', link: 'contratos.html' },
            { title: 'Almoxarifado', icon: '<path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-14v4m0 0l8 4m-8-4l-8 4m8 4l8-4m-8 4V11"/>', link: 'fornecedores.html' },
            { title: 'Inventário', icon: '<path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>', link: 'avaliacao.html' },
            { title: 'Pagamentos', icon: '<path d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>', link: 'pagamentos.html' },
            { title: 'Protocolar', icon: '<path d="M12 4v16m8-8H4"/>', link: 'novo-processo.html' },
            { title: 'Governança', icon: '<path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>', link: 'admin.html' }
        ];

        async function init() {
            document.getElementById('globalNav').innerHTML = menuItems.map(m => `<div class="nav-item ${m.link==='contratos.html'?'active':''}" onclick="location.href='${m.link}'"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">${m.icon}</svg><span class="tooltip">${m.title}</span></div>`).join('');
            
            const { data: procs } = await sb.from('licitacoes').select('id_processo');
            const { data: forns } = await sb.from('fornecedores').select('id, razao_social');
            const selP = document.getElementById('ct_proc');
            const selF = document.getElementById('ct_forn');
            if(procs) procs.forEach(p => selP.add(new Option(p.id_processo, p.id_processo)));
            if(forns) forns.forEach(f => selF.add(new Option(f.razao_social, f.id)));
            
            loadContratos();
        }

        async function loadContratos() {
            const { data } = await sb.from('contratos').select('*, fornecedores(razao_social)').order('created_at', {ascending: false});
            if(!data) return;

            document.getElementById('rowCount').innerText = data.length + " PROCESSOS";
            document.getElementById('stat_total').innerText = data.length;
            
            const totalVal = data.reduce((acc, c) => acc + parseFloat(c.valor_global || 0), 0);
            document.getElementById('stat_val').innerText = totalVal.toLocaleString('pt-br', {style:'currency', currency:'BRL'});
            document.getElementById('stat_exec').innerText = "100"; // Simulado

            const table = document.getElementById('contratoTable');
            table.innerHTML = data.map(c => `
                <tr class="row-hover transition cursor-pointer" onclick="showTimeline('${c.id}', '${c.numero_contrato}')">
                    <td class="p-4 font-black text-blue-400">${c.numero_contrato}</td>
                    <td class="p-4"><div class="font-bold text-slate-100 uppercase truncate">${c.fornecedores?.razao_social || 'N/I'}</div><div class="text-[9px] text-slate-500 uppercase">Processo: ${c.id_processo_origem || 'N/I'}</div></td>
                    <td class="p-4 text-right font-black text-slate-100">R$ ${parseFloat(c.valor_global||0).toLocaleString('pt-br')}</td>
                </tr>`).join('');

            renderChart(data);
        }

        async function showTimeline(cid, cnum) {
            document.getElementById('selCT').innerText = cnum;
            document.getElementById('timelinePanel').classList.remove('hidden');
            const { data: alts } = await sb.from('contrato_alteracoes').select('*').eq('contrato_id', cid).order('data_registro');
            const content = document.getElementById('timelineContent');
            
            let html = `<div class="timeline-node"><p class="text-[10px] font-black text-slate-100 uppercase">Assinatura do Contrato</p><p class="text-[8px] text-slate-500">Início da Vigência</p></div>`;
            if(alts && alts.length > 0) {
                html += alts.map(a => `
                <div class="timeline-node aditivo">
                    <p class="text-[10px] font-black text-amber-400 uppercase">${a.tipo_alteracao}</p>
                    <p class="text-[9px] text-slate-300 leading-tight mb-1">${a.justificativa || 'Sem justificativa'}</p>
                    <p class="text-[9px] font-bold text-blue-400">Impacto: R$ ${parseFloat(a.valor_alteracao||0).toLocaleString('pt-br')}</p>
                </div>`).join('');
            }
            content.innerHTML = html;
        }

        function renderChart(data) {
            const countBy = data.reduce((a, c) => { let v = c.fornecedores?.razao_social || 'N/I'; a[v] = (a[v]||0) + 1; return a; }, {});
            if (charts['chartForn']) charts['chartForn'].destroy();
            const ctx = document.getElementById('chartForn').getContext('2d');
            charts['chartForn'] = new Chart(ctx, { 
                type: 'bar', data: { labels: Object.keys(countBy), datasets: [{ data: Object.values(countBy), backgroundColor: '#3b82f6', borderRadius: 4 }] }, 
                options: { 
                    indexAxis: 'y', maintainAspectRatio: false, 
                    plugins: { legend: { display: false } }, 
                    scales: { x: { display: false }, y: { ticks: { color: '#64748b', font: { size: 9 } } } } 
                } 
            });
        }

        document.getElementById('contractForm').addEventListener('submit', async e => {
            e.preventDefault();
            const { error } = await sb.from('contratos').insert([{
                numero_contrato: document.getElementById('ct_num').value,
                id_processo_origem: document.getElementById('ct_proc').value,
                fornecedor_id: document.getElementById('ct_forn').value,
                valor_global: document.getElementById('ct_valor').value
            }]);
            if(!error) location.reload();
            else alert("Erro ao salvar contrato.");
        });

        init();
    </script>
</body>
</html>
